# Opens a release PR on every push to main; merging it tags the release and publishes a GitHub Release.
#
# Two manual settings are required and cannot be automated:
#   1. Repo Settings > Actions > General: enable "Allow GitHub Actions to create and approve pull requests".
#   2. Release PRs opened with GITHUB_TOKEN do not trigger ci.yml. A maintainer re-runs checks
#      (close and reopen the PR) or swaps the token for a PAT.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
