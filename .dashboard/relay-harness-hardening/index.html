.metaline{display:grid;gap:var(--sp-3);font-size:12px;color:var(--muted)}
.mrow{display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.mlabel{min-width:84px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.mrow code.tag{overflow-wrap:anywhere;white-space:normal;height:auto;min-height:22px;padding-top:2px;padding-bottom:2px}
.lastev{font-size:12px;color:var(--dim)}
.empty{padding:var(--sp-6);color:var(--muted);text-align:center}

/* scenarios */
.suites{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:var(--sp-3);margin-top:var(--sp-3)}
.suite{padding:var(--sp-3) var(--sp-4);border:1px solid var(--line-soft);border-radius:var(--r);display:grid;gap:var(--sp-2);background:var(--bg)}
.mini{width:90px}

/* two-col */
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5);align-items:start}
.dl{display:grid;gap:0}
.dl-i{padding:var(--sp-3) 0;border-top:1px solid var(--line-soft);display:grid;gap:var(--sp-2)}
.dl-i:first-child{border-top:0}
.dl-top{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.chipfiles{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.rail{position:relative;display:grid}
.ev{display:grid;grid-template-columns:14px 1fr;gap:var(--sp-3);padding:var(--sp-2) 0;position:relative}
.ev::before{content:"";position:absolute;left:3.5px;top:0;bottom:0;width:1px;background:var(--line-soft)}
.ev .dot{margin-top:5px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.ev.bad{background:var(--fail-tint);margin:0 calc(var(--sp-2) * -1);padding:var(--sp-2)}
.ev-h{display:flex;gap:var(--sp-2);align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.ev-h b{color:var(--text);font-weight:600}
.pc-group{margin-top:var(--sp-5)}
.pc-group:first-child{margin-top:0}
.pc-group>h3{font-size:13px;font-weight:600;margin-bottom:var(--sp-2);display:flex;gap:var(--sp-2);align-items:baseline}
.commit{padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-2);background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r);display:grid;gap:var(--sp-2)}
.commit .l1{display:flex;gap:var(--sp-3);align-items:flex-start;justify-content:space-between}
.commit .subj{font-weight:500;min-width:0;overflow-wrap:anywhere}
.commit .l2{display:flex;gap:var(--sp-3);align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.commit .l2 code{color:var(--muted)}
.commit .diffstat{margin-left:auto;display:inline-flex;gap:var(--sp-2)}
.ctasks{display:flex;gap:var(--sp-1);flex-wrap:wrap}
.ctasks .tag{height:20px;font-size:10.5px;padding:0 6px}
.cnote{font-size:12px;color:var(--muted);padding-left:var(--sp-3);border-left:2px solid var(--line)}
.plus{color:var(--st-verified)}.minus{color:var(--st-failed)}
.docs{display:flex;gap:var(--sp-3);flex-wrap:wrap;align-items:center}
.docs a{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-3);border:1px solid var(--line);border-radius:var(--r);color:var(--text)}
.docs a:hover{border-color:var(--accent);text-decoration:none}
.skeleton{padding:var(--sp-6);text-align:center;color:var(--muted)}
.empty-state{padding:var(--sp-5)}
.empty-state h2{font-size:16px;margin-bottom:8px}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:oklch(0.12 0.01 275 / .95);display:grid;grid-template-rows:auto minmax(0,1fr);--lb-reserve:260px}
.lb-head{display:flex;align-items:center;gap:var(--sp-3);padding:8px var(--sp-3);border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.lb-head .sp{flex:1}
.lb-body{display:grid;align-content:center;justify-content:safe center;overflow:auto;padding:12px}
.lb-group{width:min(calc(100vw - 24px),1280px,calc((100dvh - var(--lb-reserve)) * var(--ar,1.6)));display:grid;gap:8px}
.lb.actual .lb-group{width:max-content;max-width:none}
.lb-img{position:relative}
.lb-frame{position:relative;line-height:0;border:1px solid var(--line);border-radius:var(--r)}
.lb-frame img{width:100%;height:auto;display:block;border-radius:var(--r)}
.lb.actual .lb-frame img{width:auto;max-width:none}
.lb-frame .miss{display:none;line-height:1.5;padding:48px;text-align:center;color:var(--dim)}
.lb-frame.missing .miss{display:block}
.lb-frame.missing img{display:none}
.box{position:absolute;border:2px solid var(--st-built);border-radius:2px;pointer-events:none}
.box.hl{border-color:var(--on-accent);box-shadow:0 0 0 2px var(--accent)}
.box b{position:absolute;top:-10px;left:-10px;min-width:18px;height:18px;border-radius:9px;background:var(--st-built);color:var(--on-warn);font-size:11px;line-height:18px;text-align:center;padding:0 4px;font-weight:700}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:50%;background:oklch(0.14 0.01 275 / .8);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;z-index:2}
.lb-nav:hover{border-color:var(--accent)}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-details{display:grid;gap:4px}
.lb-cap{font-size:15px;font-weight:600;line-height:1.35}
.lb-meta{font-size:12px;color:var(--muted);display:flex;gap:var(--sp-2);flex-wrap:wrap;align-items:center}
.anno-list{display:flex;gap:6px;flex-wrap:wrap}
.anno-chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 8px 2px 3px;border:1px solid var(--line);border-radius:12px}
.anno-chip i{font-style:normal;min-width:16px;height:16px;border-radius:8px;background:var(--st-built);color:var(--on-warn);font-size:10.5px;font-weight:700;text-align:center;line-height:16px}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.strip button{flex:none;width:72px;aspect-ratio:16/10;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--bg)}
.strip button[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.strip img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
kbd{font-family:var(--mono);font-size:10.5px;padding:0 4px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}

/* live work: pulse is transform/opacity only. --pulse-phase (set per render) keeps loops in step across re-renders */
.ldot,.pill.live .dot{position:relative}
.ldot{display:inline-block;width:8px;height:8px;flex:none;border-radius:50%;background:var(--st-progress)}
.ldot::after,.pill.live .dot::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1.5px solid var(--st-progress);animation:live-ring var(--pulse-ms) ease-out infinite;animation-delay:var(--pulse-phase,0ms)}
.live-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--st-progress)}
.live-tag.stalled{color:var(--st-built)}
.trow.live,.now-row.live{position:relative;isolation:isolate}
.trow.live::before,.now-row.live::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;opacity:.8;background:linear-gradient(90deg,oklch(0.68 0.17 275 / .16),oklch(0.68 0.17 275 / .04) 70%);box-shadow:inset 2px 0 0 var(--accent);animation:live-breathe var(--pulse-ms) ease-in-out infinite;animation-delay:var(--pulse-phase,0ms)}
.now-row.live,.now-row.stalled{padding:var(--sp-2) var(--sp-3);margin:calc(var(--sp-2) * -1) calc(var(--sp-3) * -1);border-radius:var(--r)}
.pill.stalled{color:var(--st-built)}
.pill.stalled .dot{background:transparent;border:1.5px dashed var(--st-built)}
.trow.stalled,.now-row.stalled{box-shadow:inset 2px 0 0 var(--st-built)}
.stale-note{font-size:11.5px;color:var(--st-built)}
@keyframes live-ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes live-breathe{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes chip-blink{0%,100%{opacity:.35}50%{opacity:1}}

/* gate / review chips, risk + surface tags, cost + time */
.row-extra{display:grid;gap:var(--sp-1);padding:0 var(--pad-x) var(--sp-3) calc(var(--pad-x) + 26px);margin-top:calc(var(--sp-2) * -1);cursor:pointer}
.sumline{font-size:12px;color:var(--muted)}
.xline{display:flex;gap:var(--sp-2) var(--sp-3);flex-wrap:wrap;align-items:center}
.arow{display:inline-flex;gap:var(--sp-1);flex-wrap:wrap;align-items:center}
.an{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-right:2px}
.gchip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:4px;border:1px solid var(--line-soft);background:var(--surface-2);font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.gchip .g{display:inline-block;font-weight:700}
.gchip.c-pass{color:var(--st-verified)}
.gchip.c-fail{color:var(--st-failed);background:var(--fail-tint);border-color:var(--st-failed)}
.gchip.c-warn{color:var(--st-built)}
.gchip.c-pending{color:var(--st-progress);border-style:dashed}
.gchip.c-skip,.gchip.c-idle{color:var(--dim)}
.gchip.c-error{color:var(--st-failed);border-style:dashed}
.trow.stalled .gchip.c-pending{color:var(--st-built)}
.trow.live .gchip.c-pending .g{animation:chip-blink var(--pulse-ms) ease-in-out infinite;animation-delay:var(--pulse-phase,0ms)}
.tag.risk{font-family:var(--font);font-size:10.5px}
.tag.risk.r-high{color:var(--st-blocked)}
.m-item.cost,.m-item.time{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.attempts{display:grid;gap:var(--sp-2)}
.summary-list{margin:0;padding-left:20px;display:grid;gap:var(--sp-1)}
.hdr-cost{display:flex;gap:var(--sp-3);flex-wrap:wrap;font-size:12px;color:var(--muted)}
.hdr-cost b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .pd-grid{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .detail{grid-template-columns:minmax(0,1fr);padding-left:var(--sp-4)}
  .adv{grid-template-columns:minmax(0,1fr);gap:var(--sp-2)}
}
@media (max-width:600px){
  :root{--pad-x:var(--sp-4)}
  #app{padding:var(--sp-4) var(--sp-3) 64px;gap:var(--sp-4)}
  h1{font-size:18px}
  .search{font-size:16px}
  .row{flex-wrap:wrap}
  .row .meta{margin-left:26px;flex-wrap:wrap}
  .row .ttl{flex-basis:calc(100% - 140px)}
  .q-row{flex-wrap:wrap}
  .q-actions{margin-left:auto}
  .lb{--lb-reserve:370px}
  .lb-head{padding:6px 8px}
  .phases{grid-template-columns:1fr 1fr}
  .btn,.btn.sm,.chip{min-height:36px}
  .shotind{min-height:32px}
  .detail{padding-left:var(--sp-4)}
}
/* pseudo-elements are not matched by * alone, and the live rings/glow live on them */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"><div class="skeleton">Loading dashboard…</div></div>
<div id="lb-root"></div>
<script id="data-js" src="data.js"></script>
<script>
(function(){
'use strict';

/* ---------- constants (feature-specific bits live here) ---------- */
const SLUG="relay-harness-hardening";
const SYNC_CMD="node ~/.claude/scripts/dashboard.mjs sync agent_docs/relay-harness-hardening/TASKS.md";
const CONSTRAINT="Hard rules from TASKS.md: one `bunx tsc --noEmit` only, in the final gate (T6.1); targeted specs only, never the full e2e suite; never start the dev server; no commits unless told.";
const REFRESH_MS=10000, TICK_MS=5000, STALL_MS=10*60*1000;
const K_FILTERS='dashboard:'+SLUG+':filters', K_QDONE='dashboard:'+SLUG+':questions', K_QOPEN='dashboard:'+SLUG+':questions-open', K_ADVOPEN='dashboard:'+SLUG+':advisories-open', K_FOPEN='dashboard:'+SLUG+':filters-open';
const CAP_DELIV=4, CAP_ACT=12, CAP_COMMITS=3, CAP_ADV=8, DAY_MS=24*60*60*1000;
const CHECK_KINDS=['gate','walkthrough','dod'];
const STATUS_ORDER=['verified','built','verifying','building','ready','waiting','queued','failed','blocked'];
const GENERIC={review:'In review',verified:'Verified',built:'Built, unverified',verifying:'Verifying',building:'Building',queued:'Queued',failed:'Failed',blocked:'Blocked',ready:'Ready',waiting:'Waiting'};
const PULSE_MS=1600, JUST_DONE_MS=30*60*1000;
const VERDICT_STATE={PASS:'pass',CHANGES:'fail',FAIL:'fail',INCONCLUSIVE:'warn',skipped:'skip',ERROR:'error'};
const VERDICT_TEXT={PASS:'passed',CHANGES:'changes requested',FAIL:'failed',INCONCLUSIVE:'inconclusive',skipped:'skipped (not routed for this risk level)',ERROR:'checker crashed, so this was NOT checked'};
const CHIP_GLYPH={pass:'✓',fail:'✗',warn:'?',pending:'…',skip:'—',idle:'·',error:'!'};
const COST_NOTE='API-equivalent cost estimated from token usage, not a bill.';
const COST_APPROX_NOTE='Approximate: this task shared a batch, so its cost is an even split of the batch.';
const COST_UNKNOWN_NOTE='Cost unknown: no priced transcript for this work.';
const ROLE_GROUPS=[['builder',/^builder$/],['reviewers',/^reviewer/],['verifier',/^verifier$/],['tests',/^(unit|e2e|runner)$/]];
const KIND_LABEL={dod:'definition of done',unit:'unit test'};
const KIND_RANK={before:0,after:1,proof:2};
const EV_LABEL={task_started:'Started',task_built:'Built',verify_passed:'Verify passed',verify_failed:'Verify failed',task_verified:'Verified',task_failed:'Failed',task_blocked:'Blocked',phase_complete:'Phase complete',question:'Question asked',answered:'Answered',commit:'Committed',commit_failed:'Commit failed'};

/* ---------- storage ---------- */
const ls={
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){console.warn('storage read failed',k,e);return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('storage write failed',k,e);}}
};

/* ---------- state ---------- */
const savedF=ls.get(K_FILTERS,{});
const state={
  filters:{q:savedF.q||'',status:savedF.status||[],kind:savedF.kind||[],phase:(savedF.phase||[]).map(String)},
  selPhase:null,
  qOpen:ls.get(K_QOPEN,false),
  advOpen:ls.get(K_ADVOPEN,false),
  fOpen:ls.get(K_FOPEN,false),
  qDone:ls.get(K_QDONE,{}),
  ui:{open:{},grp:{},rows:{},showAll:{},qexp:{},advCat:'',lightbox:null},
  ar:{},
  returnFid:null
};
let pendingHash=null, lastSnap='', firstRefreshDone=false, ctx=null;

/* ---------- helpers ---------- */
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const arr=v=>v==null?[]:(Array.isArray(v)?v:[v]);
const kindLabel=k=>KIND_LABEL[k]||k;
const ICONS={
  chev:'<path d="M9 6l6 6-6 6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/>',cam:'<path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',left:'<path d="M15 6l-6 6 6 6"/>',right:'<path d="M9 6l6 6-6 6"/>',alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/>',zoom:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>'
};
const ico=(n,c)=>'<svg class="i'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true">'+ICONS[n]+'</svg>';
function rel(iso){
  if(!iso)return '—';
  const s=Math.max(0,(Date.now()-new Date(iso).getTime())/1000);
  if(isNaN(s))return '—';
  if(s<60)return Math.floor(s)+'s ago';
  const m=s/60; if(m<60)return Math.floor(m)+' min ago';
  const h=m/60; if(h<24)return Math.floor(h)+' h ago';
  return Math.floor(h/24)+' d ago';
}
function tm(iso){
  if(!iso)return '<span class="dim">—</span>';
  return '<time datetime="'+esc(iso)+'" title="'+esc(new Date(iso).toLocaleString())+'" data-rel>'+rel(iso)+'</time>';
}
function statusLabel(kind,title,status){
  const signoff=kind==='gate'&&/^SIGN-OFF/i.test(title||'');
  if(signoff){ if(status==='building')return 'Awaiting you'; if(status==='built')return 'Answered'; }
  else if(CHECK_KINDS.indexOf(kind)>-1){ if(status==='building')return 'Running checks'; if(status==='built')return 'Checks passed, unverified'; }
  return GENERIC[status]||status;
}
const pill=(kind,title,status,cls)=>'<span class="pill s-'+esc(status)+(cls?' '+cls:'')+'"><span class="dot"></span>'+esc(statusLabel(kind,title,status))+'</span>';
function evLabel(type,t){
  if(t&&(type==='task_started'||type==='task_built')){
    const signoff=t.kind==='gate'&&/^SIGN-OFF/i.test(t.title||'');
    if(signoff)return type==='task_started'?'Awaiting you':'Answered';
    if(CHECK_KINDS.indexOf(t.kind)>-1)return type==='task_started'?'Checks started':'Checks passed';
  }
  return EV_LABEL[type]||String(type||'event').replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
}
function evStatus(type){
  if(/fail/.test(type))return 'failed'; if(/block/.test(type))return 'blocked';
  if(/passed|verified|complete|commit|answered/.test(type))return 'verified';
  if(/built/.test(type))return 'built'; if(/start/.test(type))return 'building'; return 'queued';
}
// A reviewer verdict names who reviewed and what they decided; every other event keeps its generic label and status.
const REVIEW_DOT={PASS:'verified',CHANGES:'failed',FAIL:'failed',INCONCLUSIVE:'built'};
function evTitle(e,t){
  if(e.type!=='reviewer_verdict')return evLabel(e.type,t);
  return (e.reviewer||'reviewer')+' review: '+(VERDICT_TEXT[e.verdict]||e.verdict||'verdict');
}
const evStatusOf=e=>e.type==='reviewer_verdict'?(REVIEW_DOT[e.verdict]||'queued'):evStatus(e.type);
const isInProg=s=>s==='building'||s==='verifying';
const copyBtn=(text,fid,label)=>'<button class="btn sm ghost" data-act="copy" data-copy="'+esc(text)+'" data-fid="'+esc(fid)+'" aria-label="Copy '+esc(label||'text')+'">'+ico('copy')+'<span>Copy</span></button>';

/* ---------- live state, gate/review chips, cost and time (every new data.js field is optional) ---------- */
const stalledNow=d=>!!(d.current&&Date.now()-new Date(d.generatedAt).getTime()>STALL_MS);
const latestAttempt=t=>{const a=arr(t.attempts);return a.length?a[a.length-1]:null;};
const hasChanges=a=>Object.keys(a.reviews||{}).some(k=>a.reviews[k]==='CHANGES');
// A changes-requested task goes back to build, so it is not waiting on its other reviewers.
const awaitingReview=(t,a)=>(t.status==='built'||t.status==='verifying')&&!hasChanges(a);
// sync writes `pending` (routed reviewers with no verdict in the latest attempt); older data.js falls back to inferring it.
const pendingNames=(t,a)=>Array.isArray(t.pending)?t.pending:arr(t.reviewers).map(r=>r.name).filter(n=>!(a.reviews&&a.reviews[n]));
const pendingReview=t=>{const a=latestAttempt(t);return !!a&&awaitingReview(t,a)&&pendingNames(t,a).length>0;};
const isReviewed=t=>t.risk!=null||arr(t.reviewers).length>0;
// A stalled task must not look alive, so the caller decides styling from this, not from the raw status.
function liveState(t){
  if(!isInProg(t.status)&&!pendingReview(t))return '';
  return ctx.stalled?'stalled':'live';
}
const livePill=t=>pill(t.kind,t.title,pendingReview(t)&&t.status==='built'?'review':t.status,liveState(t));
function phaseLive(p){
  const states=p.tasks.map(liveState);
  return states.indexOf('live')>-1?'live':(states.indexOf('stalled')>-1?'stalled':'');
}
function liveTag(state){
  if(!state)return '';
  return state==='live'?'<span class="live-tag"><span class="ldot" aria-hidden="true"></span>Live</span>':'<span class="live-tag stalled" title="No update for 10+ minutes">Stalled</span>';
}
const money=(v,approx)=>typeof v!=='number'||!isFinite(v)?'n/a':(approx?'~':'')+'$'+(v>=1?v.toFixed(2):v.toFixed(3));
function dur(ms){
  if(typeof ms!=='number'||!isFinite(ms)||ms<=0)return ''; // 0 means no measurable span (a single event), not an elapsed time
  const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60,p=n=>String(n).padStart(2,'0');
  if(h)return h+'h '+p(m)+'m';
  return m?m+'m '+p(r)+'s':r+'s';
}
// o is a task, phase or the feature. undefined costUsd = legacy data (show nothing); null = unknown (n/a, detail only).
function costHtml(o,showUnknown){
  if(o.costUsd===undefined||(o.costUsd===null&&!showUnknown))return '';
  const known=o.costUsd!==null,approx=known&&!!o.costApprox;
  const tip=(known?(approx?COST_APPROX_NOTE+' ':''):COST_UNKNOWN_NOTE+' ')+COST_NOTE;
  return '<span class="m-item cost" title="'+esc(tip)+'">'+esc(money(o.costUsd,approx))+'</span>';
}
function timeHtml(o){
  const t=dur(o.elapsedMs);
  return t?'<span class="m-item time" title="Elapsed time">'+esc(t)+'</span>':'';
}
function chipHtml(label,state,tip){
  return '<span class="gchip c-'+state+'" role="img" aria-label="'+esc(tip)+'" title="'+esc(tip)+'">'+esc(label)+' <span class="g" aria-hidden="true">'+CHIP_GLYPH[state]+'</span></span>';
}
function attemptChips(t,a,isLatest){
  const rv=a.reviews||{},out=[];
  const verdict=(label,v,who)=>{if(v!=null)out.push(chipHtml(label,VERDICT_STATE[v]||'idle',who+': '+(VERDICT_TEXT[v]||v)));};
  verdict('gate',a.gate,'Preflight gate');
  verdict('slop',a.slop,'Slop check');
  const waiting=isLatest&&awaitingReview(t,a);
  arr(t.reviewers).forEach(r=>{
    const who=r.name+' review'+(r.model?' ('+r.model+')':'');
    if(rv[r.name]!=null)verdict(r.name,rv[r.name],who);
    else{const wait=waiting&&pendingNames(t,a).indexOf(r.name)>-1;out.push(chipHtml(r.name,wait?'pending':'idle',who+': '+(wait?'pending':'not run')));}
  });
  const routed=t.verifierRouted!==false; // explicit from sync; undefined (older data.js) means routed
  if(a.verifier!=null)verdict('verifier',a.verifier,'Verifier');
  else if(!routed&&isLatest&&!hasChanges(a)&&!pendingNames(t,a).length&&arr(t.reviewers).length)out.push(chipHtml('verifier','skip','Verifier: '+VERDICT_TEXT.skipped));
  else if(routed&&isLatest&&t.status==='verifying')out.push(chipHtml('verifier','pending','Verifier: pending'));
  return out;
}
function attemptRowHtml(t,a,i,isLatest){
  const chips=attemptChips(t,a,isLatest);
  if(!chips.length)return '';
  const n=a.n!=null?a.n:i+1;
  return '<div class="arow"><span class="an" title="Attempt '+esc(n)+'">A'+esc(n)+'</span>'+chips.join('')+'</div>';
}
function tagsHtml(t){
  const surf=arr(t.surfaces);
  return (t.risk?'<span class="tag risk r-'+esc(t.risk)+'" title="Task risk level">risk '+esc(t.risk)+'</span>':'')
    +surf.map(s=>'<span class="tag" title="Surface touched">'+esc(s)+'</span>').join('');
}
function roleBreakdown(byRole){
  const sums={};
  Object.keys(byRole||{}).forEach(k=>{
    if(typeof byRole[k]!=='number')return;
    const g=ROLE_GROUPS.find(x=>x[1].test(k)),name=g?g[0]:'other';
    sums[name]=(sums[name]||0)+byRole[k];
  });
  return Object.keys(sums).map(k=>'<span>'+esc(k)+' <b>'+esc(money(sums[k]))+'</b></span>').join('');
}
function subtitleOf(t){
  const first=arr(t.summary)[0];
  if(!first)return '';
  const ev=ctx.lastEv[t.id],finished=t.status==='built'||t.status==='verified';
  const recent=finished&&!!ev&&Date.now()-new Date(ev.at).getTime()<JUST_DONE_MS;
  return liveState(t)||recent?first:'';
}
function rowExtraHtml(t){
  const a=latestAttempt(t),sub=subtitleOf(t);
  const chips=a&&isReviewed(t)?attemptRowHtml(t,a,arr(t.attempts).length-1,true):'';
  const stalled=liveState(t)==='stalled'?'<span class="stale-note">Possibly stalled · no update for 10+ min</span>':'';
  const line=chips+tagsHtml(t)+costHtml(t,false)+timeHtml(t)+stalled;
  if(!sub&&!line)return '';
  return '<div class="row-extra" data-act="row" data-id="'+esc(t.id)+'">'+(sub?'<div class="sumline clamp1" title="'+esc(sub)+'">'+fmt(sub)+'</div>':'')+(line?'<div class="xline">'+line+'</div>':'')+'</div>';
}

/* ---------- derived context ---------- */
function allShots(d){
  const pIdx={},tIdx={};
  d.phases.forEach((p,i)=>{pIdx[p.id]=i;p.tasks.forEach((t,j)=>{tIdx[t.id]=i*10000+j;});});
  return (d.shots||[]).slice().sort((a,b)=>{
    const pa=pIdx[a.phase]!=null?pIdx[a.phase]:999,pb=pIdx[b.phase]!=null?pIdx[b.phase]:999;
    if(pa!==pb)return pa-pb;
    const ta=tIdx[a.taskId]!=null?tIdx[a.taskId]:1e9,tb=tIdx[b.taskId]!=null?tIdx[b.taskId]:1e9;
    if(ta!==tb)return ta-tb;
    const ka=KIND_RANK[a.kind]!=null?KIND_RANK[a.kind]:3,kb=KIND_RANK[b.kind]!=null?KIND_RANK[b.kind]:3;
    if(ka!==kb)return ka-kb;
    return String(a.step||a.at||'').localeCompare(String(b.step||b.at||''));
  });
}
function buildCtx(d){
  const T={},order=[],byTask={};
  d.phases.forEach(p=>p.tasks.forEach(t=>{T[t.id]={t:t,p:p};order.push(t.id);}));
  const all=allShots(d);
  all.forEach(s=>{(byTask[s.taskId]=byTask[s.taskId]||[]).push(s);});
  const lastEv={};
  (d.activity||[]).forEach(e=>arr(e.tasks).forEach(id=>{if(!lastEv[id]||new Date(e.at)>new Date(lastEv[id].at))lastEv[id]=e;}));
  return {d:d,T:T,order:order,all:all,byTask:byTask,lastEv:lastEv,stalled:stalledNow(d)};
}
function counts(d){
  const b=d.totals&&d.totals.byStatus||{};
  const v=b.verified||0,bu=b.built||0,pr=(b.building||0)+(b.verifying||0);
  return {v:v,b:bu,p:pr,total:(d.totals&&d.totals.tasks)||0,failed:b.failed||0,blocked:b.blocked||0};
}
function curPhaseId(d){return d.current&&d.current.phase!=null?String(d.current.phase):null;}
const phaseDone=p=>!!p.complete&&arr(p.tasks).length>0;
function detailPhase(d){
  const ps=d.phases;
  const id=state.selPhase||curPhaseId(d);
  return ps.find(p=>String(p.id)===String(id))||ps.find(p=>!phaseDone(p))||ps[0];
}
const filtersActive=()=>{const f=state.filters;return !!(f.q||f.status.length||f.kind.length||f.phase.length);};
const persistFilters=()=>ls.set(K_FILTERS,state.filters);
function taskMatches(t,p){
  const f=state.filters;
  if(f.status.length&&f.status.indexOf(t.status)<0)return false;
  if(f.kind.length&&f.kind.indexOf(t.kind)<0)return false;
  if(f.phase.length&&f.phase.indexOf(String(p.id))<0)return false;
  if(f.q){
    const q=f.q.toLowerCase();
    const hay=(t.id+' '+t.title+' '+arr(t.files).join(' ')+' '+(t.do||'')).toLowerCase();
    if(hay.indexOf(q)<0)return false;
  }
  return true;
}

// A reviewer-only auto-pass (low risk, no verifier) writes verify_passed{skipped} and may never be marked, so it counts too.
function isPassEvent(e){return e.type==='task_verified'||(e.type==='verify_passed'&&!!e.skipped);}
function kpiHtml(d){
  const ev=arr(d.activity),passes=ev.filter(e=>e.type==='verify_passed').length,fails=ev.filter(e=>e.type==='verify_failed').length;
  const day=new Set();
  ev.forEach(e=>{if(isPassEvent(e)&&Date.now()-new Date(e.at).getTime()<DAY_MS)arr(e.tasks).forEach(id=>day.add(id));});
  const done=d.phases.filter(phaseDone).length;
  const tiles=[[done+' / '+d.phases.length,'Phases complete'],
    passes+fails?[Math.round(passes/(passes+fails)*100)+'%','Verify pass rate']:null,
    ev.length?[String(day.size),'Passed in last 24h']:null,
    arr(d.shots).length?[String(arr(d.shots).length),'Proof screenshots']:null,
    d.costUsd!==undefined?[money(d.costUsd),'Cost (API-equivalent)',COST_NOTE]:null,
    dur(d.elapsedMs)?[dur(d.elapsedMs),'Elapsed (wall-clock)','Sum of each phase\'s earliest start to latest pass']:null].filter(Boolean);
  const roles=roleBreakdown(d.costByRole);
  return '<div class="kpis">'+tiles.map(t=>'<div class="kpi"'+(t[2]?' title="'+esc(t[2])+'"':'')+'><b>'+esc(t[0])+'</b><span>'+esc(t[1])+'</span></div>').join('')+'</div>'
   +(roles?'<div class="hdr-cost" title="'+esc(COST_NOTE)+'"><span>Cost by role</span>'+roles+'</div>':'');
}

/* ---- tasks ---- */
function isCmd(s){
  const body=s.replace(/^(?:[A-Z_][A-Z0-9_]*=\S+\s+)+/,'');
  return /^(bunx?|npx?|pnpm|yarn|node|git|agent-browser|playwright|vitest|biome|tsc|rtk|cd|ls|grep|find|wc|jq|ffprobe|ffmpeg|stat|curl|lighthouse|test)(\s|$)/.test(body)||/^\.{0,2}\//.test(body)||/^[a-z0-9_.\/-]+\s+--?[a-z]/i.test(body);
}
function proofBlock(t){
  if(t.ui===false||t.ui==null)return '';
  const ss=ctx.byTask[t.id]||[];
  if(!ss.length)return t.status==='verified'?'<div class="blk full"><h3>Proof</h3><p class="dim">No screenshot recorded</p></div>':'';
  const bf=ss.filter(s=>s.kind==='before'),af=ss.filter(s=>s.kind==='after'),rest=ss.filter(s=>s.kind!=='before'&&s.kind!=='after');
  let h='<div class="blk full"><h3>Proof</h3>';
  if(bf.length&&af.length)h+='<div class="pair">'+shotFigure(bf[0],'row')+shotFigure(af[0],'row')+'</div>';
  const others=(bf.length&&af.length?bf.slice(1).concat(af.slice(1)):bf.concat(af)).concat(rest);
  if(others.length)h+='<div class="gallery tight">'+others.map(s=>shotFigure(s,'row')).join('')+'</div>';
  return h+'</div>';
}
function metaRow(label,inner){return '<div class="mrow"><span class="mlabel">'+label+'</span>'+inner+'</div>';}
function summaryHtml(t){
  const s=arr(t.summary);
  return s.length?'<div class="blk full"><h3>Latest build summary</h3><ul class="summary-list">'+s.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul></div>':'';
}
function reviewHtml(t){
  // Attempts of pre-pipeline-2 runs are derived from events and mislead (e.g. a failed gate on a verified task), so they stay hidden.
  const reviewed=isReviewed(t);
  const rows=reviewed?arr(t.attempts).map((a,i,all)=>attemptRowHtml(t,a,i,i===all.length-1)).join(''):'';
  const tags=tagsHtml(t),routed=arr(t.reviewers).map(r=>'<span class="tag" title="Routed reviewer and model">'+esc(r.name)+(r.model?' · '+esc(r.model):'')+'</span>').join('');
  const cost=costHtml(t,reviewed),time=timeHtml(t);
  const facts=(tags?metaRow('Risk',tags):'')+(routed?metaRow('Reviewers',routed):'')+(cost?metaRow('Cost',cost+'<span class="sub">API-equivalent</span>'):'')+(time?metaRow('Time',time):'');
  return (rows?'<div class="blk full"><h3>Gates and reviews</h3><div class="attempts">'+rows+'</div></div>':'')+(facts?'<div class="full metaline">'+facts+'</div>':'');
}
function detailHtml(t){
  const ev=ctx.lastEv[t.id],ver=arr(t.verify),acc=arr(t.acceptance);

  const right=ver.length?'<div class="blk"><h3>Commands</h3>'+ver.map((c,i)=>isCmd(c)?'<div class="cmd"><code>'+esc(c)+'</code>'+copyBtn(c,'cc:'+t.id+':'+i,'command')+'</div>':'<p>'+fmt(c)+'</p>').join('')+'</div>':'';

   +'<button class="lb-nav next" data-act="lb-next" aria-label="Next screenshot" data-fid="lb-next"'+(i===list.length-1?' disabled':'')+'>'+ico('right')+'</button></div>'
   +'<div class="lb-details"><h2 class="lb-cap" id="lb-cap">'+esc(s.caption||s.file)+'</h2><div class="lb-meta"><span class="mono">'+esc(s.taskId)+'</span>'
   +(m?'<button class="linkbtn" data-act="lb-jump" data-id="'+esc(s.taskId)+'" data-fid="lb-jump">'+fmt(m.title)+' · Go to task</button>':'')
   +'<span>'+kind+'</span>'+(s.attempt!=null?'<span>attempt '+esc(s.attempt)+'</span>':'')+(s.at?'<span>'+tm(s.at)+'</span>':'')+'</div>'
   +(an.length?'<div class="anno-list">'+an.map((a,k)=>'<span class="anno-chip" data-i="'+k+'"><i>'+(k+1)+'</i>'+esc(a.label||'')+'</span>').join('')+'</div>':'')+'</div>'
   +(ts.length>1?'<div class="strip">'+ts.map(x=>'<button data-act="lb-go" data-file="'+esc(x.file)+'" aria-label="Screenshot '+esc(x.caption||x.file)+'"'+(x.file===s.file?' aria-current="true"':'')+' data-fid="lb-go:'+esc(x.file)+'"><img src="'+esc(x.href)+'" alt="" loading="lazy"></button>').join('')+'</div>':'')
   +'</div></div></div>';
}
function syncHash(){
  const lb=state.ui.lightbox;
  try{
    if(lb)history.replaceState(null,'','#shot='+encodeURIComponent(lb.file));
    else if(!pendingHash&&/^#shot=/.test(location.hash))history.replaceState(null,'',location.pathname+location.search);
  }catch(e){console.warn('hash sync failed',e);}
}
function openLb(file,from){
  state.returnFid=from||(document.activeElement&&document.activeElement.dataset.fid)||null;
  state.ui.lightbox={file:file,zoom:false};
  render();
}
function closeLb(){
  state.ui.lightbox=null;
  render();
  const f=state.returnFid;state.returnFid=null;
  const el=f&&document.querySelector('[data-fid="'+CSS.escape(f)+'"]');
  if(el)el.focus({preventScroll:true});
}
function lbStep(delta,byTask){
  const lb=state.ui.lightbox;if(!lb)return;
  const list=ctx.all,i=list.findIndex(s=>s.file===lb.file);if(i<0)return;
  let n=i;
  if(byTask){
    const tid=list[i].taskId;
    if(delta>0){while(n<list.length&&list[n].taskId===tid)n++;}
    else{while(n>=0&&list[n].taskId===tid)n--;if(n>=0){const t2=list[n].taskId;while(n>0&&list[n-1].taskId===t2)n--;}}
  }else n=i+delta;
  if(n<0||n>=list.length)return;
  lb.file=list[n].file;render();
}

/* ---------- render ---------- */
function emptyHtml(){
  return '<div class="panel empty-state"><h2>No dashboard data</h2><p class="sub">data.js was not found or failed to load. Run this from the project root, then refresh:</p><div class="cmdbox mt-sm"><code>'+esc(SYNC_CMD)+'</code>'+copyBtn(SYNC_CMD,'empty-copy','sync command')+'</div></div>';
}
function render(){
  const d=window.DASHBOARD,root=$('#app'),lbRoot=$('#lb-root');
  if(!d||!d.phases){root.innerHTML=emptyHtml();lbRoot.innerHTML='';return;}
  const ae=document.activeElement,fid=ae&&ae.dataset?ae.dataset.fid:null;
  const selR=ae&&ae.tagName==='INPUT'?[ae.selectionStart,ae.selectionEnd]:null;
  const y=window.scrollY;
  ctx=buildCtx(d);
  // Whole-page innerHTML swaps restart CSS loops; a negative delay on the wall clock re-joins them mid-cycle.
  root.style.setProperty('--pulse-ms',PULSE_MS+'ms');
  root.style.setProperty('--pulse-phase',-(Date.now()%PULSE_MS)+'ms');
  if(pendingHash&&ctx.all.some(s=>s.file===pendingHash)){state.ui.lightbox={file:pendingHash,zoom:false};pendingHash=null;}
  root.innerHTML=headerHtml(d)+stuckHtml(d)+questionsHtml(d)+advisoriesHtml(d)+nowHtml(d)+phasesHtml(d)+phaseDetailHtml(d)+tasksHtml(d)+scenarioHtml(d)
    +'<div class="two">'+deliverablesHtml(d)+activityHtml(d)+'</div>'+commitsHtml(d)+docsHtml(d);
  lbRoot.innerHTML=lbHtml();
  const open=!!lbRoot.firstChild;
  root.inert=open;
  window.scrollTo(0,y);
  let target=null;
  if(fid){try{target=document.querySelector('[data-fid="'+CSS.escape(fid)+'"]');}catch(e){console.warn('fid restore failed',e);}}
  if(open&&(!target||!lbRoot.contains(target)))target=$('[data-fid="lb-close"]',lbRoot);
  if(target){target.focus({preventScroll:true});if(selR&&target.setSelectionRange){try{target.setSelectionRange(selR[0],selR[1]);}catch(e){console.warn('caret restore failed',e);}}}
  syncHash();
}

/* ---------- actions ---------- */
function toggle(arr0,v){const i=arr0.indexOf(v);if(i<0)arr0.push(v);else arr0.splice(i,1);}
function clearFilters(){const f=state.filters;f.q='';f.status=[];f.kind=[];f.phase=[];}
function jump(id){
  const e=ctx.T[id];if(!e)return;
  state.ui.lightbox=null;
  if(!taskMatches(e.t,e.p)){clearFilters();persistFilters();}
  state.ui.grp[e.p.id]=true;state.ui.rows[id]=true;
  render();
  const el=document.querySelector('[data-row="'+CSS.escape(id)+'"]');
  if(el)el.scrollIntoView({block:'center'});
}
function copyText(text,btn){
  const done=()=>{const s=btn.querySelector('span');if(s){s.textContent='Copied';setTimeout(()=>{s.textContent='Copy';},1200);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,e=>console.warn('clipboard failed',e));return;}
  const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');done();}catch(e){console.warn('copy failed',e);}
  ta.remove();
}
function act(el){
  const a=el.dataset.act,ds=el.dataset,u=state.ui;
  switch(a){
    case 'lb-close':closeLb();return;
    case 'lb-prev':lbStep(-1);return;
    case 'lb-next':lbStep(1);return;
    case 'lb-zoom':u.lightbox.zoom=!u.lightbox.zoom;render();return;
    case 'lb-go':u.lightbox.file=ds.file;render();return;
    case 'lb-jump':jump(ds.id);return;
    case 'copy':copyText(ds.copy,el);return;
    case 'adv-panel':state.advOpen=!state.advOpen;ls.set(K_ADVOPEN,state.advOpen);break;
    case 'adv-cat':u.advCat=ds.val;break;
    case 'f-panel':state.fOpen=!state.fOpen;ls.set(K_FOPEN,state.fOpen);break;
    case 'q-panel':state.qOpen=!state.qOpen;ls.set(K_QOPEN,state.qOpen);break;
    case 'q-exp':u.qexp[ds.key]=!u.qexp[ds.key];break;
    case 'q-done':state.qDone[ds.key]=true;ls.set(K_QDONE,state.qDone);break;
    case 'q-mark-all':arr(window.DASHBOARD.questions).forEach(q=>{if(!q.answer)state.qDone[qKey(q)]=true;});ls.set(K_QDONE,state.qDone);break;
    case 'q-restore':delete state.qDone[ds.key];ls.set(K_QDONE,state.qDone);break;
    case 'q-restore-all':state.qDone={};ls.set(K_QDONE,state.qDone);break;
    case 'tog':u.open[ds.key]=!u.open[ds.key];break;
    case 'sel-phase':state.selPhase=String(state.selPhase)===ds.id?null:ds.id;break;
    case 'grp':{const p=ctx.d.phases.find(x=>String(x.id)===ds.id);const full=p.total>0&&p.verified===p.total;const cur=u.grp[ds.id]!=null?u.grp[ds.id]:!full;u.grp[ds.id]=!cur;break;}
    case 'row':u.rows[ds.id]=!u.rows[ds.id];break;
    case 'chip':case 'tok':
      if(ds.grp==='q')state.filters.q='';else toggle(state.filters[ds.grp],ds.val);
      persistFilters();break;
    case 'clear':clearFilters();persistFilters();break;
    case 'showall':u.showAll[ds.key]=!u.showAll[ds.key];break;
    case 'jump':jump(ds.id);return;
    case 'shot':openLb(ds.file,el.dataset.fid);return;
    case 'rowshot':{const s=(ctx.byTask[ds.id]||[])[0];if(s)openLb(s.file,el.dataset.fid);return;}
    default:return;
  }
  render();
}
document.addEventListener('click',ev=>{
  const el=ev.target.closest&&ev.target.closest('[data-act]');
  if(!el||el.disabled)return;
  ev.preventDefault();
  act(el);
});
document.addEventListener('input',ev=>{
  if(ev.target.matches&&ev.target.matches('.search')){state.filters.q=ev.target.value;persistFilters();render();}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target;
  if(t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName==='SPAN'&&(ev.key==='Enter'||ev.key===' ')){
    ev.preventDefault();ev.stopPropagation();act(t);return;
  }
  const lb=state.ui.lightbox;if(!lb)return;
  if(ev.key==='Tab'){
    const root=$('#lb-root'),f=[].slice.call(root.querySelectorAll('button:not([disabled]),[href],[tabindex="0"]'));
    if(!f.length)return;
    const first=f[0],last=f[f.length-1];
    if(!root.contains(document.activeElement)){ev.preventDefault();first.focus();}
    else if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}
    else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}
    return;
  }
  const map={Escape:()=>closeLb(),ArrowLeft:()=>lbStep(-1),ArrowRight:()=>lbStep(1),PageUp:()=>lbStep(-1,true),PageDown:()=>lbStep(1,true),
    Home:()=>{lb.file=ctx.all[0].file;render();},End:()=>{lb.file=ctx.all[ctx.all.length-1].file;render();},
    z:()=>{lb.zoom=!lb.zoom;render();},Z:()=>{lb.zoom=!lb.zoom;render();}};
  if(map[ev.key]){ev.preventDefault();map[ev.key]();}
},true);
document.addEventListener('load',ev=>{
  const img=ev.target;
  if(img.tagName!=='IMG'||!img.closest('.lb-frame'))return;
  const lb=state.ui.lightbox;if(!lb||!img.naturalHeight)return;
  const ar=img.naturalWidth/img.naturalHeight;
  state.ar[lb.file]=ar;
  const g=img.closest('.lb-group');if(g)g.style.setProperty('--ar',ar);
},true);
document.addEventListener('error',ev=>{
  const img=ev.target;
  if(img.tagName!=='IMG')return;
  const host=img.closest('.thumb')||img.closest('.lb-frame');
  if(host)host.classList.add('missing');
  else if(img.closest('.strip'))img.style.visibility='hidden';
},true);
document.addEventListener('mouseover',ev=>{
  const c=ev.target.closest&&ev.target.closest('.anno-chip');
  if(!c)return;
  const b=document.querySelector('.lb .box[data-i="'+c.dataset.i+'"]');if(b)b.classList.add('hl');
});
document.addEventListener('mouseout',ev=>{
  const c=ev.target.closest&&ev.target.closest('.anno-chip');
  if(!c)return;
  const b=document.querySelector('.lb .box[data-i="'+c.dataset.i+'"]');if(b)b.classList.remove('hl');
});

/* ---------- data refresh ---------- */
function snapshot(){
  const d=window.DASHBOARD;
  if(!d)return 'none';
  return JSON.stringify(d)+'|'+stalledNow(d);
}
function onData(){
  const s=snapshot();
  if(s===lastSnap)return;
  lastSnap=s;
  render();
}
function refresh(){
  const old=document.getElementById('data-js');
  const s=document.createElement('script');
  s.id='data-js';
  s.src='data.js?t='+Date.now();
  s.onload=()=>{if(old&&old.parentNode)old.remove();firstRefreshDone=true;if(pendingHash&&ctx&&!ctx.all.some(x=>x.file===pendingHash))pendingHash=null;onData();};
  s.onerror=()=>{console.warn('data.js refresh failed');s.remove();};
  document.head.appendChild(s);
}
function tick(){
  document.querySelectorAll('time[data-rel]').forEach(t=>{
    const iso=t.getAttribute('datetime'),r=rel(iso);
    if(t.textContent!==r)t.textContent=r;
    t.title=new Date(iso).toLocaleString();
  });
}

/* ---------- boot ---------- */
const hm=/^#shot=(.+)$/.exec(location.hash);
if(hm){try{pendingHash=decodeURIComponent(hm[1]);}catch(e){console.warn('bad hash',e);}}
lastSnap=snapshot();
render();
setInterval(refresh,REFRESH_MS);
setInterval(tick,TICK_MS);
})();
</script>
</body>
