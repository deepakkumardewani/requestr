<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay Polish · Progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Schibsted+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  /* surfaces tinted toward indigo hue 275 */
  --bg:oklch(0.17 0.012 275);
  --surface:oklch(0.21 0.014 275);
  --surface-2:oklch(0.25 0.016 275);
  --line:oklch(0.34 0.02 275);
  --text:oklch(0.95 0.006 275);
  --text-2:oklch(0.78 0.015 275);
  --text-3:oklch(0.68 0.02 275);
  --accent:oklch(0.68 0.17 277);
  --accent-ink:oklch(0.16 0.03 277);
  --accent-soft:oklch(0.30 0.07 277);
  --accent-text:oklch(0.82 0.1 277);
  --s-verified:oklch(0.78 0.15 155);
  --s-built:oklch(0.82 0.13 85);
  --s-verifying:oklch(0.80 0.11 215);
  --s-building:oklch(0.80 0.12 250);
  --s-queued:oklch(0.76 0.03 275);
  --s-ready:oklch(0.82 0.08 185);
  --s-waiting:oklch(0.66 0.025 275);
  --s-failed:oklch(0.74 0.17 25);
  --s-blocked:oklch(0.76 0.15 55);
  --space-xs:4px;--space-sm:8px;--space-md:12px;--space-lg:16px;--space-xl:24px;--space-2xl:32px;--space-3xl:48px;
  --radius:8px;--radius-sm:4px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-body:"Schibsted Grotesk",system-ui,sans-serif;
  --font-display:"Bricolage Grotesque","Schibsted Grotesk",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent-text)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-999px;top:0;background:var(--accent);color:var(--accent-ink);padding:8px 12px;z-index:100}
.skip:focus{left:8px;top:8px}
.wrap{max-width:1200px;margin:0 auto;padding:var(--space-xl) var(--space-lg) var(--space-3xl)}
.mono{font-family:var(--font-mono);font-size:13px}
.muted{color:var(--text-2)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;letter-spacing:-.01em}
h1{font-size:32px;line-height:1.15;text-wrap:balance}
h2{font-size:18px;line-height:1.3}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}
/* backtick spans from TASKS.md render as inline code */
.ic{font-family:var(--font-mono);font-size:.86em;font-weight:500;padding:0 4px;border-radius:3px;background:var(--bg);color:var(--text)}
/* trailing "[highest risk]" on a phase name becomes an amber tag */
.risk{flex:none;display:inline-flex;align-items:center;gap:4px;font-family:var(--font-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--s-blocked);white-space:nowrap}
.risk svg{width:11px;height:11px}

/* header */
header.top{display:grid;grid-template-columns:1fr auto;gap:var(--space-md) var(--space-lg);align-items:end;margin-bottom:var(--space-lg)}
.top-meta{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;justify-content:flex-end}
.updated{font-size:13px;color:var(--text-3)}
.stalled{display:inline-block;margin-left:var(--space-sm);padding:2px 8px;border-radius:var(--radius-sm);background:oklch(0.30 0.07 55);color:var(--s-blocked);font-weight:600;font-size:12px}
.progress{grid-column:1/-1;display:grid;gap:var(--space-sm)}
.prog-head{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-xs) var(--space-sm);color:var(--text-2);font-size:14px}
.prog-head .pct{font-family:var(--font-display);font-size:24px;font-weight:700;line-height:1;color:var(--text)}
.prog-head .sep{color:var(--text-3)}
.progress .bar{height:10px}
.bar{background:var(--surface-2);border-radius:99px;overflow:hidden;display:flex;height:8px}
.bar>i{display:block;height:100%;background:var(--s-verified);transition:width .3s var(--ease)}
.bar>i.b,.sw.b{background:repeating-linear-gradient(135deg,var(--s-built) 0 3px,color-mix(in oklch,var(--s-built) 22%,var(--surface-2)) 3px 6px)}
.bar>i.a{background:var(--accent)}
.bar>i.x{background:var(--s-failed)}
.bar.sm{height:6px}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-xs) var(--space-lg);font-size:13px;color:var(--text-2)}
.legend li{display:inline-flex;align-items:center;gap:6px}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sw{flex:none;width:10px;height:10px;border-radius:2px;background:var(--s-verified)}
.sw.a{background:var(--accent)}
.sw.x{background:var(--s-failed)}
.sw.r{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}

/* constraint banner: compact, capped at ~80ch */
.constraint{display:flex;gap:var(--space-sm);align-items:flex-start;padding:var(--space-sm) var(--space-md);border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--radius);margin-bottom:var(--space-lg)}
.constraint svg{flex:none;margin-top:3px}
.constraint ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;max-width:80ch;font-size:13px;line-height:1.45;color:var(--text-2)}
.constraint strong{color:var(--text)}

/* panels */
section.panel{margin-top:var(--space-2xl)}
/* Now sits directly under Questions: one attention block, tighter gap */
section.panel.panel-tight{margin-top:var(--space-lg)}
.panel-head{display:flex;align-items:baseline;gap:var(--space-md);margin-bottom:var(--space-md);flex-wrap:wrap}
.count{font-size:13px;color:var(--text-3)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-lg)}
.sub-h{margin:0 0 var(--space-sm);font-family:var(--font-body);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3)}

/* two-up row, only for Gates|Scenarios (Questions and Now always stack full width) */
.pair{display:grid;gap:0 var(--space-2xl);grid-template-columns:minmax(0,1fr);align-items:start}
.pair>section.panel{min-width:0}
@media(min-width:1000px){.pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

/* status pill: 11px caps, 4px radius, no border; icon + text so color is not alone */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:var(--radius-sm);background:color-mix(in oklch,var(--c) 18%,var(--surface));color:var(--c);white-space:nowrap}
.pill svg{width:11px;height:11px}
.pill.built{background:transparent;box-shadow:inset 0 0 0 1px var(--c)}
.pill.built svg{stroke-dasharray:2 2}
.st-verified{--c:var(--s-verified)}.st-built{--c:var(--s-built)}.st-verifying{--c:var(--s-verifying)}.st-building{--c:var(--s-building)}
.st-queued{--c:var(--s-queued)}.st-ready{--c:var(--s-ready)}.st-waiting{--c:var(--s-waiting)}.st-failed{--c:var(--s-failed)}.st-blocked{--c:var(--s-blocked)}
.st-accent{--c:var(--accent-text)}.st-muted{--c:var(--text-3)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 12px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:13px;font-weight:500;transition:background .15s var(--ease),border-color .15s var(--ease)}
.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn:active{background:var(--accent)}
.btn.copied{border-color:var(--s-verified);color:var(--s-verified)}
.btn.quiet{background:transparent;border-color:transparent;color:var(--accent-text)}
.btn.quiet:hover{border-color:var(--accent);background:var(--accent-soft)}
.push{margin-left:auto}

/* now */
.now-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md)}
.now-head h3{font-size:16px}
.now-name{font-size:14px;color:var(--text-2)}
.now-meta{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md);font-size:13px;color:var(--text-2)}
.att{display:inline-flex;align-items:center;gap:6px}
.pips{display:inline-flex;gap:3px}
.pips i{width:8px;height:8px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.pips i.on{background:var(--accent);box-shadow:none}
.pips.last i.on{background:var(--s-failed)}
.now ul{list-style:none;margin:var(--space-md) 0 0;padding:0;display:grid;gap:6px}
.now li{display:grid;grid-template-columns:auto 56px 1fr;gap:var(--space-sm);align-items:center;font-size:14px}
.now li .pill{justify-self:start}
.now-idle{display:grid;gap:var(--space-sm)}
.now-idle .cmd{margin:0}
.now-done{margin:0;font-size:14px;color:var(--text-2)}
.cmd{display:flex;gap:var(--space-sm);align-items:center;flex-wrap:wrap;margin-top:var(--space-sm)}
.cmd code{flex:1 1 220px;min-width:0;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font-mono);font-size:13px}
.upnext{display:grid;gap:var(--space-xs);margin-top:var(--space-sm);padding-top:var(--space-md);border-top:1px solid var(--line)}
.upnext .jrow{display:grid;grid-template-columns:auto 1fr;gap:var(--space-sm);align-items:baseline;text-align:left}

/* generic jump link: a task id that scrolls to its row */
.jrow{all:unset;box-sizing:border-box;cursor:pointer;min-height:32px;padding:4px var(--space-sm);margin-inline:calc(-1 * var(--space-sm));border-radius:var(--radius-sm);font-size:14px}
.jrow:hover{background:var(--surface-2)}
.jrow:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.jrow .id{font-size:13px}

/* phases: compact cards in a dense grid; double as task filters */
.phases{display:grid;gap:var(--space-sm);grid-template-columns:repeat(auto-fill,minmax(156px,1fr))}
@media(min-width:720px){.phases{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.phase{display:grid;gap:var(--space-sm);grid-template-rows:auto auto 1fr;align-content:stretch;text-align:left;cursor:pointer;width:100%;min-height:44px;padding:var(--space-md);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);transition:border-color .15s var(--ease),background .15s var(--ease)}
.phase:hover{border-color:color-mix(in oklch,var(--accent) 55%,var(--line))}
.phase[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in oklch,var(--accent) 14%,var(--surface))}
.phase[aria-pressed=true] .pid{color:var(--accent-text)}
/* name always reserves two lines so the bar and meta sit at the same height on every card */
.ptop{display:flex;gap:6px;align-items:flex-start;min-width:0}
.pid{flex:none;font-family:var(--font-mono);font-size:12px;line-height:1.3;padding-top:2px;color:var(--text-3)}
.pname{flex:1;min-width:0;font-weight:600;font-size:14px;line-height:1.3;min-height:2.6em;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nowtag{flex:none;display:inline-flex;align-items:center;gap:4px;padding-top:3px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent-text)}
.nowtag i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.gate{flex:none;display:inline-flex;align-self:flex-start;padding-top:2px;color:var(--s-verified)}
.pmeta{align-self:start;display:flex;flex-wrap:wrap;gap:2px var(--space-md);font-size:12px;color:var(--text-2)}
.pmeta b{color:var(--text);font-weight:600}
.pmeta .pb{color:var(--s-built)}
.pmeta .pa{color:var(--accent-text)}
.pmeta .pbad{display:inline-flex;align-items:center;gap:3px;font-weight:600;color:var(--c)}
.pmeta .pbad svg{width:11px;height:11px}
/* on cards the risk is an icon-only marker in the name row, so the meta row never wraps and heights stay even */
.risk.rmark{align-self:flex-start;padding-top:2px}
.risk.rmark svg{width:14px;height:14px}

/* phase detail: what the selected phase adds, how to check it, what its checkpoint verifies */
.pd-grid{display:grid;gap:var(--space-lg) var(--space-xl);grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.pd-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pd-block{min-width:0}
.pd-block .txt,.pd-block li{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.pd-block ol,.pd-block ul{margin:0;padding-left:20px;display:grid;gap:6px}
.pd-block .quiet-note{margin:0;font-size:13px;font-style:italic;color:var(--text-3)}
.pd-cp{margin:0 0 var(--space-sm);font-size:13px;color:var(--text-2)}
.panel-head .pid{font-size:14px;color:var(--accent-text)}
.panel-head .hint{font-size:12px;color:var(--text-3)}
.panel-head h2 .risk{margin-left:var(--space-sm);vertical-align:2px}

/* gates: sign-off cards + checkpoint track */
.signoffs{display:grid;gap:var(--space-sm);grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.so{all:unset;box-sizing:border-box;cursor:pointer;display:grid;gap:6px;align-content:start;padding:var(--space-md);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .15s var(--ease)}
.so:hover{border-color:var(--accent)}
.so:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.so.ask{border-color:var(--accent);background:color-mix(in oklch,var(--accent) 10%,var(--surface))}
.so.done{border-color:color-mix(in oklch,var(--s-verified) 45%,var(--line))}
.so-top{display:flex;align-items:center;gap:var(--space-sm);font-size:12px;color:var(--text-3)}
.so-top .id{font-size:12px}
.so-t{font-weight:600;font-size:14px;line-height:1.35}
.so-when{font-size:12px;color:var(--text-2)}
.so-when.up{color:var(--accent-text);font-weight:600}
.track{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.step{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px 3px 4px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:12px;color:var(--text-2);transition:border-color .15s var(--ease)}
.step:hover{border-color:var(--accent);color:var(--text)}
.step .n{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font-family:var(--font-mono);font-size:11px;color:var(--text-2)}
.step .n svg{width:12px;height:12px}
.step.verified{border-color:color-mix(in oklch,var(--s-verified) 50%,var(--line));color:var(--text)}
.step.verified .n{background:color-mix(in oklch,var(--s-verified) 22%,var(--surface));color:var(--s-verified)}
.step.built .n{background:transparent;box-shadow:inset 0 0 0 1px var(--s-built);color:var(--s-built)}
.step.active{border-color:var(--accent);color:var(--text)}
.step.active .n{background:var(--accent);color:var(--accent-ink)}
.step.bad{border-color:var(--s-failed);color:var(--text)}
.step.bad .n{background:color-mix(in oklch,var(--s-failed) 22%,var(--surface));color:var(--s-failed)}
.sub-h.after{margin-top:var(--space-lg)}

/* scenario coverage */
.sc-sum{display:grid;gap:var(--space-sm);margin-bottom:var(--space-md)}
.sclist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sc{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:2px var(--space-sm);align-items:center;width:100%;min-height:44px;padding:6px var(--space-sm);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);transition:border-color .15s var(--ease)}
.sc:hover{border-color:var(--accent)}
.sc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sc .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sc.st-built .dot{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.sc .area{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .num{font-family:var(--font-mono);font-size:12px;color:var(--text-3)}
.sc .sub{grid-column:2/-1;font-size:11px;color:var(--text-3)}

/* plan check (data quality in TASKS.md) */
.plancheck{display:flex;gap:var(--space-sm);align-items:flex-start;margin-bottom:var(--space-md);padding:var(--space-sm) var(--space-md);border:1px solid var(--s-blocked);background:color-mix(in oklch,var(--s-blocked) 9%,var(--surface));border-radius:var(--radius)}
.plancheck svg{flex:none;margin-top:3px;color:var(--s-blocked)}
.plancheck ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:13px;color:var(--text-2);max-width:80ch}
.plancheck strong{color:var(--text)}

/* attention panels */
.attn{border:1px solid var(--s-failed);background:color-mix(in oklch,var(--s-failed) 10%,var(--surface))}
.stuckitem+.stuckitem{margin-top:var(--space-md)}
.kv{display:grid;gap:2px;font-size:14px}
.kv>span:first-child{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.stuckitem{padding:var(--space-md);background:var(--bg);border-radius:var(--radius-sm);display:grid;gap:var(--space-xs)}

/* questions: one bordered list, divided rows */
.id{font-family:var(--font-mono);color:var(--accent-text);font-weight:500}
.panel-head.qhead{align-items:center}
.panel-head.qhead.shut{margin-bottom:0}
.count.badge{padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-text);font-weight:600}
.qlist{border:1px solid var(--accent);background:var(--surface);border-radius:var(--radius);overflow:hidden}
.qrow{display:grid;grid-template-columns:1fr auto;column-gap:var(--space-sm);align-items:start;padding-right:var(--space-md)}
.qrow+.qrow{border-top:1px solid var(--line)}
.qrow.open{background:color-mix(in oklch,var(--accent-soft) 35%,var(--surface))}
.qtoggle{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:20px 1fr;gap:var(--space-sm);align-items:start;min-height:56px;padding:var(--space-md) 0 var(--space-md) var(--space-md)}
.qtoggle:hover{background:var(--surface-2)}
.qtoggle:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.qchev{display:grid;place-items:center;width:20px;height:20px;margin-top:1px;color:var(--text-3);transition:transform .2s var(--ease)}
.qtoggle[aria-expanded=true] .qchev{transform:rotate(90deg)}
.qmain{display:grid;gap:2px;min-width:0}
.qmeta{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--space-xs) var(--space-sm);font-size:12px;color:var(--text-3)}
.qmeta .id{font-size:13px}
.qtext{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-size:14px}
.qrow.open .qtext{display:block;-webkit-line-clamp:unset;line-clamp:unset}
.qact{display:flex;gap:var(--space-sm);align-items:center;align-self:start;padding:10px 0}
.qdetail{grid-column:1/-1;display:grid;gap:var(--space-sm);padding:0 0 var(--space-md) calc(var(--space-md) + 20px + var(--space-sm))}
.qdetail[hidden]{display:none}
.qhint{margin:0;font-size:13px;color:var(--text-3)}
.qdonebar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-sm);margin-top:var(--space-sm);font-size:13px}
/* ghost button: pull back by its padding so its text lines up with the list edge */
.qdonebar>.btn.quiet:first-child{margin-inline-start:calc(-1 * var(--space-md))}
.qdonelist{list-style:none;margin:var(--space-xs) 0 0;padding:0;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.qdonelist li{display:grid;grid-template-columns:1fr auto;gap:var(--space-sm);align-items:center;padding:var(--space-sm) var(--space-md)}

/* shared bits */

.txt{display:block;margin:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere;max-width:75ch}
.txtbtn{all:unset;box-sizing:border-box;display:grid;gap:2px;align-content:start;width:100%;min-height:36px;cursor:pointer;border-radius:var(--radius-sm)}

.txtbtn .hint{font-size:12px;color:var(--accent-text)}
.txtbtn:hover .hint{text-decoration:underline}
.txtbtn:disabled{cursor:default;min-height:0}

.txtbtn:focus-visible,.more:focus-visible,.docs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.more{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:4px 12px;border-radius:var(--radius-sm);border:1px dashed var(--line);background:transparent;color:var(--text-2);cursor:pointer;font-size:13px;transition:border-color .15s var(--ease),color .15s var(--ease)}
.more:hover{border-color:var(--accent);color:var(--text)}
.more.block{display:flex;width:100%;margin-top:var(--space-md)}
.more.fmore{font-family:var(--font-mono);font-size:12px}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.file{font-family:var(--font-mono);font-size:12px;background:var(--bg);padding:2px 6px;border-radius:var(--radius-sm);color:var(--text-2);overflow-wrap:anywhere;max-width:100%}
.note{font-size:13px;font-style:italic;color:var(--text-3)}

/* deliverables */
.list.dl{gap:var(--space-lg)}
.deliv{display:grid;gap:var(--space-sm);padding-bottom:var(--space-lg);border-bottom:1px solid var(--line)}
.deliv:last-child{border:0;padding-bottom:0}
.deliv .txt{color:var(--text)}
.deliv:first-child>.txtbtn .txt,.deliv:first-child>.txt{font-weight:600}
.deliv-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);font-size:12px;color:var(--text-3)}

/* activity timeline */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-lg)}
.tl h3.day{margin:0 0 var(--space-sm);font-family:var(--font-body);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
.evs{list-style:none;margin:0;padding:0}
.ev{position:relative;display:grid;grid-template-columns:20px minmax(0,1fr);gap:var(--space-md);padding-bottom:var(--space-xs)}
.ev::before{content:"";position:absolute;left:9.5px;top:0;bottom:0;width:1px;background:var(--line)}
.ev:first-child::before{top:14px}
.ev:last-child::before{bottom:calc(100% - 14px)}
.ev-dot{position:relative;z-index:1;margin-top:5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklch,var(--c) 22%,var(--surface));color:var(--c)}
.ev-dot svg{width:12px;height:12px}
.ev.dashed .ev-dot{background:var(--surface);box-shadow:inset 0 0 0 1px var(--c)}
.ev.dashed .ev-dot svg{stroke-dasharray:2 2}
.ev-body{display:grid;gap:2px;min-width:0;padding:var(--space-xs) var(--space-sm);border-radius:var(--radius-sm)}
.ev.tint .ev-body{background:color-mix(in oklch,var(--c) 11%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in oklch,var(--c) 40%,transparent)}
.ev-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);font-size:13px;min-height:22px}
.ev-label{font-weight:600;color:var(--c)}
.ev-head time{margin-left:auto;font-size:12px;color:var(--text-3);white-space:nowrap}
.ev .txt{color:var(--text-2)}
.ev.tint .txt{color:var(--text)}
.feed-empty{margin:0;font-size:14px;color:var(--text-2)}
.feed-empty .sub{display:block;margin-top:2px;font-size:13px;color:var(--text-3)}

/* commits: one card per phase, divided rows (no nested cards) */
.cmgroups{display:grid;gap:var(--space-lg);grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.cmgroup>h3{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px var(--space-md);margin-bottom:var(--space-sm);font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text-2)}
.cmgroup .ghc{font-size:12px;font-weight:400;color:var(--text-3);font-variant-numeric:tabular-nums}
.cmlist{list-style:none;margin:0;padding:0;display:grid;gap:var(--space-md)}
.cm{display:grid;gap:6px;min-width:0;padding-bottom:var(--space-md);border-bottom:1px solid var(--line)}
.cm:last-child{border:0;padding-bottom:0}
.cm.bad{padding:var(--space-sm);border:1px solid color-mix(in oklch,var(--s-failed) 45%,transparent);border-radius:var(--radius-sm);background:color-mix(in oklch,var(--s-failed) 9%,var(--surface))}
.cm-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-sm);font-size:12px;color:var(--text-3)}
.cm-head time{margin-left:auto;white-space:nowrap}
a.tag{text-decoration:none}
a.tag:hover{text-decoration:underline}
.cm-branch{font-family:var(--font-mono);font-size:12px;color:var(--text-2);overflow-wrap:anywhere}
.cm-subj{margin:0;font-size:14px;font-weight:500;line-height:1.45;overflow-wrap:anywhere;max-width:75ch;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.cm-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-xs) var(--space-md);font-size:12px;color:var(--text-2)}
.cm-tags{display:inline-flex;flex-wrap:wrap;gap:4px}
.cm-diff{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.cm-diff .add{color:var(--s-verified)}
.cm-diff .del{color:var(--s-failed)}
.cm-ev{margin:0;font-size:12px;color:var(--text-3);overflow-wrap:anywhere}
.cm-err{margin:0;font-size:13px;color:var(--text);overflow-wrap:anywhere}
.cm-err b{color:var(--s-failed);font-weight:600}

/* tasks: toolbar */
.tb{display:flex;flex-wrap:wrap;gap:var(--space-md) var(--space-xl);align-items:center;margin-bottom:var(--space-sm)}
.fbar{display:contents}
.search{flex:0 1 320px;min-width:0;min-height:44px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.search::placeholder{color:var(--text-3)}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fgroup .lbl{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:13px;color:var(--text-2);transition:background .15s var(--ease),border-color .15s var(--ease)}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip[aria-pressed=true]{background:color-mix(in oklch,var(--accent) 22%,var(--surface));border-color:var(--accent);color:var(--text)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip .n{color:var(--text-3);font-variant-numeric:tabular-nums;font-size:12px}
.chip.ph{min-width:36px;justify-content:center;padding-inline:8px;font-family:var(--font-mono);font-size:12px}
.sum{display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;min-height:32px;font-size:13px;color:var(--text-2)}
.tok{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 8px 3px 12px;border-radius:99px;cursor:pointer;font-size:12px;color:var(--text);background:color-mix(in oklch,var(--accent) 14%,var(--surface));border:1px solid color-mix(in oklch,var(--accent) 55%,var(--line))}
.tok:hover{border-color:var(--accent)}
.tok svg{width:12px;height:12px;flex:none}
.linkbtn{min-height:32px;padding:0 var(--space-sm);background:none;border:0;cursor:pointer;font-size:13px;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--text)}

/* tasks: collapsible phase groups and rows */
.phgroup{margin-top:var(--space-sm);border-top:1px solid var(--line)}
.phgroup>h3{margin:0;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--text-2)}
.ghbtn{display:flex;flex-wrap:wrap;align-items:center;gap:2px var(--space-md);width:100%;min-height:44px;padding:var(--space-xs) 0;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ghbtn .chev{flex:none;color:var(--text-3);transition:transform .2s var(--ease)}
.ghbtn[aria-expanded=true] .chev{transform:rotate(90deg)}
.ghbtn:hover{color:var(--text)}
.ghbtn .gname{flex:1 1 auto;min-width:0}
.phgroup .ghc{font-size:12px;font-weight:400;color:var(--text-3);font-variant-numeric:tabular-nums}
.phgroup .ghc .gb{color:var(--s-built)}
.trows{display:grid;gap:6px;padding-bottom:var(--space-md)}
.task{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);transition:border-color .15s var(--ease)}
.task.open{border-color:color-mix(in oklch,var(--accent) 45%,var(--line));background:color-mix(in oklch,var(--accent) 4%,var(--surface))}
.task>button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;width:100%;min-height:48px;padding:var(--space-sm) var(--space-lg) var(--space-sm) var(--space-md);gap:2px var(--space-md);align-items:center;border-radius:var(--radius);
  grid-template-columns:16px 60px minmax(0,1fr) auto auto;grid-template-areas:"chev tid tt meta stat"}
.task>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.task:not(.open)>button:hover{background:var(--surface-2)}
.task.open>button{border-radius:var(--radius) var(--radius) 0 0}
.task.open>button:hover{background:color-mix(in oklch,var(--surface-2) 40%,transparent)}
.task .chev{grid-area:chev;color:var(--text-3);transition:transform .2s var(--ease)}
.task.open .chev{transform:rotate(90deg);color:var(--accent-text)}
.task .tid{grid-area:tid;font-family:var(--font-mono);font-size:13px;color:var(--accent-text)}
.task .tt{grid-area:tt;min-width:0;overflow-wrap:anywhere}
.task .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:var(--space-sm);align-items:center;justify-content:flex-end}
.task .stat{grid-area:stat;justify-self:end}
.ktag{font-size:11px;line-height:1.5;padding:0 6px;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--text-3);white-space:nowrap}
.ktag.you{border-color:var(--accent);color:var(--accent-text)}
.cnt{font-family:var(--font-mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.cnt.warn{color:var(--s-blocked)}
.task .detail{display:none;margin:0 var(--space-lg) 0 var(--space-md);padding:var(--space-md) 0 var(--space-lg);border-top:1px solid var(--line);gap:var(--space-md) var(--space-xl);grid-template-columns:minmax(0,1fr)}
.task.open .detail{display:grid}
@media(min-width:720px){.task .detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.task .detail .wide{grid-column:1/-1}}
/* align-content:start stops a taller sibling cell from stretching label rows */
.task .kv{gap:6px;align-content:start}
.task .kv>span:first-child{font-size:11px;font-weight:600;letter-spacing:.08em}
.task .stamp{font-size:12px;color:var(--text-3)}
.deps{display:flex;flex-wrap:wrap;gap:6px}
.dep{font-family:var(--font-mono);font-size:12px;padding:2px 7px;border-radius:var(--radius-sm);background:var(--bg);color:var(--text-2)}
.dep.ok{color:var(--s-verified);background:color-mix(in oklch,var(--s-verified) 14%,var(--bg))}
.dep.bad{color:var(--s-blocked);background:color-mix(in oklch,var(--s-blocked) 14%,var(--bg))}
.bul{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;overflow-wrap:anywhere}
.cmds{display:grid;gap:var(--space-sm);min-width:0}
.cmdrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-sm);align-items:start}
.cmdtxt{display:block;min-width:0;max-height:16em;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5}
.cmdtxt.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden}
.cmdact{display:grid;gap:2px;justify-items:end}
.cmdnote{grid-column:1/-1;font-size:12px;color:var(--text-3);overflow-wrap:anywhere}
.cmdprose{margin:0;font-size:14px;line-height:1.5;color:var(--text-2);overflow-wrap:anywhere}
.gherkin{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);padding:var(--space-sm) var(--space-md);border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:12.5px;color:var(--text-2)}

/* docs */
.docs{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
.docs a{display:inline-flex;align-items:center;gap:var(--space-sm);min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius);text-decoration:none;background:var(--surface);font-size:14px}
.docs a svg{flex:none;width:14px;height:14px;color:var(--text-3)}
.docs a:hover{border-color:var(--accent)}
.docs a:hover svg{color:var(--accent-text)}
.docs.other a{background:transparent;color:var(--text-2)}
.docgroup+.docgroup{margin-top:var(--space-md)}
.tasksfile{margin:var(--space-md) 0 0;font-size:12px;color:var(--text-3);overflow-wrap:anywhere}
.empty{padding:var(--space-xl);text-align:center;color:var(--text-2);border:1px dashed var(--line);border-radius:var(--radius)}
.empty code{font-family:var(--font-mono);background:var(--bg);padding:2px 6px;border-radius:var(--radius-sm)}
#fatal{display:none}
.loading{color:var(--text-3)}

/* narrow screens: single block for every section */
@media(max-width:560px){
  .wrap{padding-inline:var(--space-md)}
  h1{font-size:26px}
  header.top{grid-template-columns:1fr}
  .top-meta{justify-content:flex-start}
  .qrow{grid-template-columns:1fr;padding-right:0}
  .qact{padding:0 var(--space-md) var(--space-md) calc(var(--space-md) + 20px + var(--space-sm))}
  .qdetail{padding-right:var(--space-md)}
  .now-meta{margin-left:0;width:100%}
  .now li{grid-template-columns:auto 1fr}
  .now li .nt{grid-column:1/-1}
  .task>button{grid-template-columns:16px 1fr auto;grid-template-areas:"chev tid stat" ". tt tt" ". meta meta"}
  .task .meta{justify-content:flex-start}
  .search{flex-basis:100%}
  .cmdrow{grid-template-columns:minmax(0,1fr)}
  .cmdact{display:flex;align-items:center;justify-content:space-between}
  .sclist{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

  /* ---------- gates: sign-offs + checkpoint track (derived from kind and title, never ids) ---------- */

  /* ---------- plan check: dependency problems in TASKS.md the runner cannot resolve ---------- */

  /* ---------- deliverables, activity, docs ---------- */

    items.forEach(function (a) {
      var k = dayLabel(a.at);
      if (!byLabel[k]) { byLabel[k] = { label: k, items: [] }; groups.push(byLabel[k]); }
      byLabel[k].items.push(a);
    });
    return groups;
  }
  /* long text -> expandable clamp button; short text -> plain paragraph. fitClamps() disables clamps that do not truncate */
  function clampText(key, text, lines) {
    if (String(text).length < CLAMP_MIN_CHARS) return '<p class="txt">' + inline(text) + "</p>";
    var open = !!state.ui.open[key];
    return '<button type="button" class="txtbtn' + (lines === 3 ? " l3" : "") + '" data-expand="' + key + '" data-fid="x:' + key + '" aria-expanded="' + open + '"><span class="txt">' + inline(text) + '</span><span class="hint">' + (open ? "Show less" : "Show more") + "</span></button>";
  }
  function showAllBtn(which, total, cap) {
    if (total <= cap) return "";
    var on = state.ui[which + "All"];
    return '<button type="button" class="more block" data-more="' + which + '" data-fid="more:' + which + '" aria-expanded="' + on + '">' + (on ? "Show latest " + cap : "Show all " + total) + "</button>";
  }
  function fileChips(key, files) {
    var open = !!state.ui.open[key], shown = open ? files : files.slice(0, FILES_CAP);
    return '<div class="files">' + shown.map(function (f) { return '<span class="file" title="' + esc(f) + '">' + esc(open ? f : shortPath(f)) + "</span>"; }).join("") +
      (files.length > FILES_CAP ? '<button type="button" class="more fmore" data-expand="' + key + '" data-fid="x:' + key + '" aria-expanded="' + open + '">' + (open ? "Show fewer" : "+" + (files.length - FILES_CAP) + " more") + "</button>" : "") + "</div>";
  }
  function feedEmpty(main, sub) { return '<p class="feed-empty">' + esc(main) + '<span class="sub">' + esc(sub) + "</span></p>"; }
  function deliverables(d) {
    var l = d.deliverables || [], shown = state.ui.delAll ? l : l.slice(0, DEL_CAP);
    return '<section class="panel" aria-labelledby="h-dl"><div class="panel-head"><h2 id="h-dl">Latest deliverables</h2>' + (l.length ? '<span class="count">' + l.length + "</span>" : "") + '</div><div class="card">' +
      (l.length ? '<ul class="list dl">' + shown.map(function (x) {
        var key = slug((x.at || "") + "_" + (x.tasks || []).join("_")), files = fileParts(x.files).files;
        return '<li class="deliv"><div class="deliv-head">' + when(x.at) + tags(x.tasks) + "</div>" + clampText("d_" + key, x.text || "", 3) +
          (files.length ? fileChips("f_" + key, files) : "") + "</li>";
      }).join("") + "</ul>" + showAllBtn("del", l.length, DEL_CAP) : feedEmpty("Nothing delivered yet.", "Each verified task adds a summary and its files here.")) + "</div></section>";
  }
  /* events about checkpoint-style tasks and sign-offs: "Built" would misread as code being written */
  var CHECK_EVENT_LABEL = { build_started: "Checks started", task_started: "Checks started", task_built: "Checks passed" };
  var SIGNOFF_EVENT_LABEL = { build_started: "Awaiting you", task_started: "Awaiting you", task_built: "Answered" };
  function everyTask(d, ids, test) {
    return !!(ids && ids.length) && ids.every(function (id) { var t = taskById(d, id); return !!t && test(t.kind, t.title); });
  }
  function eventLabel(a, d, m) {
    if (SIGNOFF_EVENT_LABEL[a.type] && everyTask(d, a.tasks, isSignoff)) return SIGNOFF_EVENT_LABEL[a.type];
    if (CHECK_EVENT_LABEL[a.type] && everyTask(d, a.tasks, isCheckKind)) return CHECK_EVENT_LABEL[a.type];
    return m.label;
  }
  function eventRow(a, d) {
    var m = eventMeta(a.type), text = a.text || "", label = eventLabel(a, d, m);
    var key = "a_" + slug((a.at || "") + "_" + a.type + "_" + (a.tasks || []).join("_") + "_" + text.length);
    return '<li class="ev st-' + m.tone + (m.tint ? " tint" : "") + (m.dashed ? " dashed" : "") + '"><span class="ev-dot" aria-hidden="true">' + svg(m.icon) + '</span><div class="ev-body"><div class="ev-head"><span class="ev-label">' +
      esc(label) + "</span>" + tags(a.tasks) + when(a.at) + "</div>" + (text ? clampText(key, text, 2) : "") + "</div></li>";
  }
  function activity(d) {
    var l = d.activity || [], shown = state.ui.actAll ? l : l.slice(0, ACT_CAP), groups = groupByDay(shown);
    var count = l.length > ACT_CAP && !state.ui.actAll ? "Showing " + ACT_CAP + " of " + l.length : l.length + (l.length === 1 ? " event" : " events");
    return '<section class="panel" aria-labelledby="h-ac"><div class="panel-head"><h2 id="h-ac">Activity</h2>' + (l.length ? '<span class="count">' + count + "</span>" : "") + '</div><div class="card">' +
      (l.length ? '<ol class="tl">' + groups.map(function (g) {
        return "<li>" + (groups.length > 1 ? '<h3 class="day">' + esc(g.label) + "</h3>" : "") + '<ol class="evs">' + g.items.map(function (a) { return eventRow(a, d); }).join("") + "</ol></li>";
      }).join("") + "</ol>" + showAllBtn("act", l.length, ACT_CAP) : feedEmpty("No events logged yet.", "Builds, verifications and questions appear here as phases run.")) + "</div></section>";
  }
  /* a doc belongs to this feature when its name/source mentions the slug, or a task lists its source */
  function docGroups(d) {
    var key = (d.feature && d.feature.slug || "").toLowerCase(), listed = {}, mine = [], other = [];
    allTasks(d).forEach(function (x) { fileParts(x.t.files).files.forEach(function (f) { listed[f.replace(/\s*\(.*$/, "")] = 1; }); });
    (d.docs || []).forEach(function (x) {
      var hay = (x.name + " " + x.source).toLowerCase();
      if ((key && hay.indexOf(key) >= 0) || listed[x.source]) mine.push(x); else other.push(x);
    });
    return { mine: mine, other: other };
  }
  function docLinks(list, cls) {
    return '<div class="docs' + (cls ? " " + cls : "") + '">' + list.map(function (x) {
      return '<a href="' + esc(x.href) + '" target="_blank" rel="noopener" title="' + esc(x.source) + '" aria-label="' + esc(x.name) + ' (opens in new tab)"><span>' + esc(x.name) + "</span>" + EXT_ICON + "</a>";
    }).join("") + "</div>";
  }
  function docs(d) {
    var g = docGroups(d), both = g.mine.length && g.other.length;
    var path = (d.projectRoot ? d.projectRoot.replace(/\/$/, "") + "/" : "") + (d.tasksFile || "");
    var body = !g.mine.length && !g.other.length ? '<p class="muted" style="margin:0">No docs linked.</p>' :
      (g.mine.length ? '<div class="docgroup">' + (both ? '<p class="sub-h">This feature</p>' : "") + docLinks(g.mine) + "</div>" : "") +
      (g.other.length ? '<div class="docgroup"><p class="sub-h">Other project docs</p>' + docLinks(g.other, "other") + "</div>" : "");
    return '<section class="panel" aria-labelledby="h-dc"><div class="panel-head"><h2 id="h-dc">Docs</h2></div>' + body +
      '<p class="tasksfile mono">Tasks file: ' + esc(path) + "</p></section>";
  }
  /* ---------- commits: DASHBOARD.commits (newest first), grouped by phase ---------- */
  var COMMIT_CAP = 3;
  var COMMIT_STATE = {
    pushed: { cls: "st-verified", text: "pushed", icon: '<path d="M8 13V3.5M4 7l4-4 4 4"/>' },
    local:  { cls: "st-queued",   text: "local only", icon: '<path d="M3 8h10"/>' },
    failed: { cls: "st-failed",   text: "failed", icon: ICON_X }
  };
  function commitState(c) { return c.ok === false ? "failed" : c.pushed ? "pushed" : "local"; }
  function commitPill(c) {
    var s = COMMIT_STATE[commitState(c)];
    return '<span class="pill ' + s.cls + '">' + svg(s.icon) + esc(s.text) + "</span>";
  }
  /* phase order follows the newest commit in each phase, so the latest work is on top */
  function commitGroups(list) {
    var groups = [], byPhase = {};
    list.forEach(function (c) {
      var k = c.phase == null ? "" : String(c.phase);
      if (!byPhase[k]) { byPhase[k] = { phase: k, items: [] }; groups.push(byPhase[k]); }
      byPhase[k].items.push(c);
    });
    return groups;
  }
  function evidenceText(e) {
    if (!e) return "";
    if (Array.isArray(e)) return e.map(evidenceText).join(" · ");
    if (typeof e !== "object") return String(e);
    return Object.keys(e).filter(function (k) { return e[k] != null && e[k] !== ""; }).map(function (k) {
      var v = e[k];
      return k + ": " + (typeof v === "object" ? JSON.stringify(v) : v);
    }).join(" · ");
  }
  function shaTag(c) {
    var sha = esc(c.shortSha || String(c.sha || "").slice(0, 7) || "no sha"), title = esc((c.sha || "") + (c.author ? " · " + c.author : ""));
    return c.url ? '<a class="tag" href="' + esc(c.url) + '" target="_blank" rel="noopener" title="' + title + '" aria-label="Commit ' + sha + ' (opens in new tab)">' + sha + "</a>" :
      '<span class="tag" title="' + title + '">' + sha + "</span>";
  }
  function commitDiff(c) {
    if (c.missing || c.filesChanged == null) return "";
    var n = Number(c.filesChanged) || 0;
    return '<span class="cm-diff">' + n + (n === 1 ? " file" : " files") + ' · <span class="add">+' + (Number(c.added) || 0) + '</span> / <span class="del">&minus;' + (Number(c.removed) || 0) + "</span></span>";
  }
  function commitRow(c) {
    var failed = commitState(c) === "failed", ev = evidenceText(c.evidence);
    var meta = (c.attempt ? "<span>verified on attempt " + esc(c.attempt) + "/3</span>" : "") +
      (c.tasks && c.tasks.length ? '<span class="cm-tags">' + tags(c.tasks) + "</span>" : "") + commitDiff(c);
    return '<li class="cm' + (failed ? " bad" : "") + '"><div class="cm-head">' + shaTag(c) + commitPill(c) +
      (c.missing ? '<span class="pill st-blocked">' + icon("blocked") + "commit not found (rebased?)</span>" : "") +
      (c.branch ? '<span class="cm-branch">' + esc(c.branch) + "</span>" : "") + when(c.committedAt || c.at) + "</div>" +
      '<p class="cm-subj" title="' + esc(c.subject || "") + '">' + esc(c.subject || "(no subject)") + "</p>" +
      (meta ? '<div class="cm-meta tnum">' + meta + "</div>" : "") +
      (failed && c.error ? '<p class="cm-err"><b>Error:</b> ' + esc(c.error) + "</p>" : "") +
      (ev ? '<p class="cm-ev">' + esc(ev) + "</p>" : "") + "</li>";
  }
  function commitGroup(d, g) {
    var key = "cm_" + slug(g.phase || "none"), all = !!state.ui.open[key], shown = all ? g.items : g.items.slice(0, COMMIT_CAP);
    var name = g.phase ? phaseName(d, g.phase) : "";
    var head = g.phase ? "Phase " + esc(g.phase) + (name ? " &middot; " + nameHtml(name, false) : "") : "No phase";
    var more = g.items.length > COMMIT_CAP ? '<button type="button" class="more block" data-expand="' + key + '" data-fid="x:' + key + '" aria-expanded="' + all + '">' +
      (all ? "Show latest " + COMMIT_CAP : "Show all " + g.items.length) + "</button>" : "";
    return '<div class="cmgroup"><h3><span>' + head + '</span><span class="ghc">' + g.items.length + (g.items.length === 1 ? " commit" : " commits") + "</span></h3>" +
      '<div class="card"><ul class="cmlist">' + shown.map(commitRow).join("") + "</ul>" + more + "</div></div>";
  }
  function commits(d) {
    var l = d.commits || [];
    if (!l.length) return "";
    var groups = commitGroups(l), bad = l.filter(function (c) { return c.ok === false; }).length;
    return '<section class="panel" aria-labelledby="h-cm"><div class="panel-head"><h2 id="h-cm">Commits</h2><span class="count tnum">' + l.length + (l.length === 1 ? " commit" : " commits") +
      (bad ? " · " + bad + " failed" : "") + "</span></div>" + '<div class="cmgroups">' + groups.map(function (g) { return commitGroup(d, g); }).join("") + "</div></section>";
  }
  function bottomHtml(d) { return '<div class="feed">' + deliverables(d) + activity(d) + "</div>" + commits(d) + docs(d); }
  /* a clamp only stays interactive if its text really overflows (or is already expanded) */
  function fitClamps() {
    var btns = document.querySelectorAll(".txtbtn[data-expand]");
    Array.prototype.forEach.call(btns, function (b) {
      var open = b.getAttribute("aria-expanded") === "true";
      var t = b.querySelector(".txt");
      var truncates = open || t.scrollHeight > t.clientHeight + 1;
      b.disabled = !truncates;
      if (!truncates) b.removeAttribute("aria-expanded"); else b.setAttribute("aria-expanded", open);
    });
  }

  /* ---------- render ---------- */
  var searchEl = null, listEl = null, filtersEl = null;
  function buildShell() {
    var app = document.getElementById("app");
    app.innerHTML = '<div id="top"></div><section class="panel" id="tasks" aria-labelledby="h-tk"><div class="panel-head"><h2 id="h-tk">All tasks</h2></div>' +
      '<div class="tb"><input class="search" type="search" id="q" placeholder="Search id, title, file or scenario id" aria-label="Search tasks"><div id="filters" class="fbar"></div></div>' +
      '<div id="list"></div></section><div id="bottom"></div>';
    searchEl = document.getElementById("q"); listEl = document.getElementById("list"); filtersEl = document.getElementById("filters");
    searchEl.value = state.filters.q;
    searchEl.addEventListener("input", function () { state.filters.q = searchEl.value; persist(); renderList(window.DASHBOARD); });
  }
  function renderList(d) { var r = tasksList(d); filtersEl.innerHTML = r.filters; listEl.innerHTML = r.html; }
  /* fixed order: header, constraint, stuck, questions, now (full width, stacked), phases, phase detail, then feature pairs */
  function topHtml(d) {
    return header(d) + constraint() + stuck(d) + questions(d) + now(d) + phases(d) + phaseDetail(d) +
      '<div class="pair">' + gates(d) + scenarios(d) + "</div>";
  }

  /* the one focus mechanism: remember data-fid of the focused control (or an explicit target), re-focus the match after render */
  function activeFid() { var a = document.activeElement; return a && a.getAttribute ? a.getAttribute("data-fid") : null; }
  function restoreFocus(fid) {
    if (!fid) return;
    var nodes = document.querySelectorAll("[data-fid]"), i;
    for (i = 0; i < nodes.length; i++) {
      if (nodes[i].getAttribute("data-fid") !== fid) continue;
      if (nodes[i] !== document.activeElement) nodes[i].focus({ preventScroll: true });
      return;
    }
  }

  function render(data) {
    var fatal = document.getElementById("fatal"), app = document.getElementById("app");
    if (!data) { fatal.style.display = "block"; fatal.innerHTML = emptyState(); app.style.display = "none"; return; }
    var fid = state.fid || activeFid(); state.fid = null;
    fatal.style.display = "none"; app.style.display = "";
    if (!searchEl || !document.body.contains(searchEl)) buildShell();
    document.getElementById("top").innerHTML = topHtml(data);
    renderList(data);
    document.getElementById("bottom").innerHTML = bottomHtml(data);
    fitClamps();
    restoreFocus(fid);
  }

  /* ---------- jump to a task row: clear only the filters that would hide it, unfold its group ---------- */
  function jumpTo(id) {
    var d = window.DASHBOARD, hit = allTasks(d).filter(function (x) { return x.t.id === id; })[0], f = state.filters;
    if (!hit) return;
    if (f.status.length && f.status.indexOf(hit.t.status) < 0) f.status = [];
    if (f.kind.length && f.kind.indexOf(hit.t.kind) < 0) f.kind = [];
    if (f.phase.length && f.phase.indexOf(hit.p.id) < 0) f.phase = [];
    if (!matchesQuery(hit.t)) { f.q = ""; searchEl.value = ""; }
    persist();
    state.ui.grp[hit.p.id] = true;
    state.ui.grpf[hit.p.id] = true;
    state.expanded[id] = true;
    state.fid = "task:" + id;
    render(d);
    var row = document.getElementById("d-" + id);
    if (row && row.parentNode) row.parentNode.scrollIntoView({ block: "center" });
  }

  /* ---------- events (delegated; survive re-render) ---------- */
  function copyText(el) {
    var key = el.dataset.key;
    var done = function () { state.copied[key] = true; render(window.DASHBOARD); setTimeout(function () { delete state.copied[key]; render(window.DASHBOARD); }, COPIED_MS); };
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(el.dataset.copy).then(done, function (err) { console.warn("clipboard failed", err); }); return; }
    var ta = document.createElement("textarea"); ta.value = el.dataset.copy; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (err) { console.warn("copy failed", err); }
    ta.remove();
  }
  function toggleGroup(el) {
    var map = anyFilter() ? state.ui.grpf : state.ui.grp;
    map[el.dataset.grp] = el.getAttribute("aria-expanded") !== "true";
    state.fid = el.getAttribute("data-fid");
    render(window.DASHBOARD);
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-copy],[data-f],[data-phase],[data-jump],[data-task],[data-clear],[data-clearq],[data-more],[data-expand],[data-grp],[data-qpanel],[data-qtoggle],[data-qdone],[data-qdone-all],[data-qrestore],[data-qrestore-all],[data-qshowdone]");
    if (!el) return;
    var ds = el.dataset;
    /* specific controls first; the generic task toggle is last so nothing nested can be swallowed by it */
    if (ds.copy != null) { copyText(el); return; }
    if (handleQuestionClick(el)) return;
    if (ds.jump) { jumpTo(ds.jump); return; }
    if (ds.more) { var flag = ds.more + "All"; state.ui[flag] = !state.ui[flag]; state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return; }
    if (ds.grp) { toggleGroup(el); return; }
    if (ds.expand) { state.ui.open[ds.expand] = !state.ui.open[ds.expand]; state.fid = el.getAttribute("data-fid"); render(window.DASHBOARD); return; }
    if (ds.clearq) { state.filters.q = ""; searchEl.value = ""; persist(); render(window.DASHBOARD); return; }
    if (ds.clear) { state.filters = { q: "", status: [], kind: [], phase: [] }; searchEl.value = ""; persist(); render(window.DASHBOARD); return; }
    if (ds.f) {
      toggle(state.filters[ds.f], ds.v); persist();
      /* removing a token hands focus to its chip, which survives in the filter row */
      state.fid = "f:" + ds.f + ":" + ds.v;
      render(window.DASHBOARD); return;
    }
    /* no scroll jump: the detail panel right below the cards is the immediate feedback */
    if (ds.phase) { toggle(state.filters.phase, ds.phase); persist(); state.fid = "ph:" + ds.phase; render(window.DASHBOARD); return; }
    if (ds.task) { var id = ds.task; state.expanded[id] = !state.expanded[id]; var row = el.closest(".task"); row.classList.toggle("open", !!state.expanded[id]); el.setAttribute("aria-expanded", !!state.expanded[id]); }
  });
  window.addEventListener("resize", fitClamps);

  /* ---------- refresh: swap the data.js script tag, re-render, no page reload ---------- */
  function loadData() {
    var old = document.getElementById("data-script");
    if (old) old.remove();
    var s = document.createElement("script");
    s.id = "data-script";
    s.src = "data.js?t=" + Date.now();
    s.onload = s.onerror = renderIfChanged;
    document.head.appendChild(s);
  }
  /* skipping identical data keeps focus, hover and open rows stable across refreshes */
  var lastSnapshot = null;
  function renderIfChanged() {
    var d = window.DASHBOARD;
    /* stalled depends on the clock, so it is part of the snapshot */
    var snap = d ? JSON.stringify(d) + isStalled(d) : "";
    if (snap === lastSnapshot) return;
    lastSnapshot = snap;
    render(window.DASHBOARD);
  }
  function tickTimes() {
    var els = document.querySelectorAll("time[datetime]");
    for (var i = 0; i < els.length; i++) els[i].textContent = ago(els[i].getAttribute("datetime"));
    renderIfChanged();
  }
  loadData();
  setInterval(loadData, REFRESH_MS);
  setInterval(tickTimes, TICK_MS);
})();
</script>
</body>
</html>
