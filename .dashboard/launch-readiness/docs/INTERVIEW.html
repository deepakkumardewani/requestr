<script>document.getElementById("doc").innerHTML = marked.parse("# launch-readiness — confirmed interview (user said explicit \"Yes, proceed\")\n\n## Confirmed restate\n**Outcome:** Requestr is launch-ready:\n1. **Tour** — driver.js first-run tour with a custom React popover in Requestr design language (replaces dead boarding.js `src/components/common/OnboardingTour.tsx`, currently commented out at `src/components/layout/MainLayout.tsx:208`; `src/hooks/useFirstTimeUser.ts` uses localStorage key `rq_onboarding_complete`). Mirror visual-ai pattern (`/Users/deepakdewani1/Documents/Programs/vue/text-to-image/visual-ai/apps/web/src/components/Intro/tour.ts` + `TourPopover.vue`): `data-tour` anchors as a single-source constant map, resolve only visible anchors, wait for anchors, MIN_TOUR_STEPS guard + toast on too-small screens, popover with \"step x/N\", Back/Next/Skip/close. Auto-starts once on first /app visit (desktop only); replayable from Settings and command palette. ~7 steps: URL bar + send (Ctrl+Enter) → sample requests → save to collection → environments → Chains (visual canvas) → Relay AI agent dock → Ctrl+K command palette / Ctrl+/ shortcuts. Relay's own 3-step coach (`src/components/relay/RelayOnboarding.tsx`) stays separate. Remove boarding.js dependency.\n2. **Analytics** — PostHog (cookieless/memory persistence, anonymous random id, EU/US region configurable via env) behind a swappable `track()` adapter so a self-built backend can replace PostHog later by changing ONE adapter. Events flow browser → our own Next route `/api/ingest` (proxy) → PostHog; the server strips IP and enforces an event/property allowlist (proxy = implementation detail, user did not veto). Typed event map for the whole app; fold in the existing Relay telemetry (`src/lib/relay/telemetry.ts`, currently local-only DOM events `RelayEventMap`). NEVER send request content: no URLs, hosts, headers, bodies, env values, prompts, responses. Analytics ON by default; honour Do-Not-Track and Global Privacy Control automatically; \"Share anonymous usage data\" toggle in Settings → General (`src/components/settings/GeneralSection.tsx`); a one-line non-blocking notice on first visit; privacy page (`src/app/privacy/page.tsx`, currently claims \"No analytics, tracking scripts\") rewritten to list exactly what is collected. Remove Cronitor RUM (`useCronitor` in `src/providers/AppProviders.tsx` + package `@cronitorio/cronitor-rum-nextjs`).\n   - Planner must decide which params/events to track (activation funnel, feature usage, retention signals) — propose an explicit event catalogue.\n3. **Error tracking** — capture unhandled errors + ErrorBoundary (`src/components/common/ErrorBoundary.tsx`) crashes via the same adapter (PostHog error tracking), scrubbed of request data; also respects opt-out.\n4. **Feedback** — custom Requestr-styled widget submitting as PostHog Survey responses (API mode) through the same adapter (swappable). Entry points: (a) always-available \"Feedback\" item in sidebar/help menu; (b) ONE auto-prompt after the aha moment: ≥3 sessions on separate calendar days AND (≥10 successful requests OR ≥1 chain run OR ≥1 Relay action), only when idle (no request in flight, not typing), never in first session, never while the tour or What's New is showing. Content: 1–5 rating + optional text + optional contact email. Dismiss → snooze 30 days; submit → never auto-ask again.\n5. **Releases + What's New** — release-please GitHub Action: conventional commits → release PR (bumps package.json version, updates CHANGELOG.md) → merge creates git tag + GitHub Release with notes. In-app What's New modal (like visual-ai `WhatsNewModal.vue`) shown once per version to RETURNING users only, never together with the tour. IMPORTANT user requirement: modal content must be user-facing, plain language, non-technical — NOT the raw technical changelog. So keep a curated per-version highlights source separate from CHANGELOG.md, keyed by the same version.\n6. **Local-data backup nudge** — all user data lives in the browser; gentle periodic \"export a backup\" reminder only once the user has real data (uses existing `src/lib/backup`). Must not collide with feedback/What's New/tour prompts (one prompt at a time).\n7. **Repo / README** — README overhaul: hero (logo, one-liner, badges, live-app CTA https://requestr-api.vercel.app/, demo video) → TOC/index → Why → Features with screenshots (HTTP/GraphQL/WebSocket, Chains, Relay AI agent as its own section, encrypted sharing, health monitoring, toolbox, import) → Quick start → Privacy & analytics (honest) → Tech stack → Contributing → License. Pull key details from the landing page (`src/app/(home)`). Learn from top GitHub READMEs. \"Chain blocks & keyboard shortcuts\" section moves to `docs/` (linked); self-hosting section removed; Roadmap moves to `ROADMAP.md`. Review/refresh GitHub topics (and package.json keywords). Add CONTRIBUTING.md, SECURITY.md, CODE_OF_CONDUCT.md, issue templates (bug, feature, feedback) and PR template, good-first-issue labels. Screenshot placement planned per section.\n   - **Demo video**: scripted Playwright recording of the real app (seeded deterministic data, high resolution) composed in Remotion with title card, zoom-ins on the active area, per-scene captions, speed ramps (fast through typing/waiting, normal at payoff), end card with URL. ~60–90s. Scenes: send request → chain run → Relay builds something → encrypted share. Plus GIF/poster fallback. Final upload to GitHub (user-attachments URL via drag-drop) is a MANUAL user step.\n\n**User:** first-time and returning developers using Requestr; GitHub visitors deciding whether to try it.\n**Why now:** last gap before public launch — currently would launch blind (no usage data, feedback or onboarding).\n**Success:** new user gets a working tour; events + errors land in PostHog with zero PII/request content; feedback arrives at the right moment; merging to main yields a GitHub Release; README scannable in \u003c30s with inline video.\n**Constraints:** honest privacy-first promise; backend swappable by replacing one adapter; bun only (never npm); Next.js app router, Zustand stores in `src/stores/` for cross-cutting UI state, next-intl messages in `messages/`; shadcn UI; follow project CLAUDE.md. Only one prompt/modal at a time across tour / What's New / feedback / backup nudge / analytics notice. All localStorage access wrapped in try/catch (private mode) — see RelayOnboarding pattern.\n**Out of scope:** self-hosting docs, user accounts, a self-built analytics backend (future), opt-in consent banner.\n**Branch:** `feature/launch-readiness` from `main`.\n\n## Other repo facts found\n- Upstash Redis client exists: `src/lib/redis.ts`.\n- `.env.example` has RELAY_API_KEY, NEXT_PUBLIC_RELAY_ENABLED. New env vars must be added there.\n- Existing API routes under `src/app/api/` (ai, hub, proxy, relay, schema, share).\n");</script></body></html>
