"50" rx="6"/><text class="t" x="400" y="392" text-anchor="middle">IndexedDB</text><text class="s" x="400" y="408" text-anchor="middle">src/lib/idbSchema.ts</text><rect class="n" x="610" y="55" width="240" height="38" rx="6"/><text class="t" x="730" y="71" text-anchor="middle">/api/proxy</text><text class="s" x="730" y="87" text-anchor="middle">outbound HTTP</text><rect class="n" x="610" y="105" width="240" height="38" rx="6"/><text class="t" x="730" y="121" text-anchor="middle">/api/ai</text><text class="s" x="730" y="137" text-anchor="middle">structured AI actions</text><rect class="n" x="610" y="155" width="240" height="38" rx="6"/><text class="t" x="730" y="171" text-anchor="middle">/api/relay/chat, /api/relay/stt</text><text class="s" x="730" y="187" text-anchor="middle">assistant and speech</text><rect class="n" x="610" y="205" width="240" height="38" rx="6"/><text class="t" x="730" y="221" text-anchor="middle">/api/share</text><text class="s" x="730" y="237" text-anchor="middle">share links</text><rect class="n" x="610" y="255" width="240" height="38" rx="6"/><text class="t" x="730" y="271" text-anchor="middle">/api/schema</text><text class="s" x="730" y="287" text-anchor="middle">body to types</text><rect class="n" x="610" y="305" width="240" height="38" rx="6"/><text class="t" x="730" y="321" text-anchor="middle">/api/hub</text><text class="s" x="730" y="337" text-anchor="middle">hub slugs</text><path class="e" d="M400 310V370" marker-end="url(#a)"/><path class="e" d="M540 235H580" marker-end="url(#a)"/><text class="s" x="560" y="228" text-anchor="middle">fetch</text></svg>
