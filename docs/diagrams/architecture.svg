<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="ti de"><title id="ti">Requestr architecture</title><desc id="de">Browser UI and Zustand stores persist to IndexedDB and localStorage; six Next.js API routes serve proxy, AI, Relay, share, schema and hub.</desc><style>
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#6b7080;--rule:#c9ccd6;--card:#ffffff;--accent:#bf4520}
@media (prefers-color-scheme:dark){:root{--paper:#1b1d27;--ink:#e8eaf2;--muted:#9aa0b4;--rule:#444a5e;--card:#262a38;--accent:#ff8a63}}
text{font-family:ui-sans-serif,system-ui,sans-serif;fill:var(--ink)}
.t{font-size:13px;font-weight:600}.s{font-size:10.5px;fill:var(--muted)}.h{font-size:11px;letter-spacing:.08em;fill:var(--muted)}
.n{fill:var(--card);stroke:var(--rule);stroke-width:1.2}.f{fill:var(--card);stroke:var(--accent);stroke-width:2}
.z{fill:none;stroke:var(--rule);stroke-dasharray:4 4}.e{stroke:var(--muted);stroke-width:1.3;fill:none}
