<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="ti de"><title id="ti">Request pipeline</title><desc id="de">A request resolves variables, is sent through the proxy route to the upstream server, and the response is stored.</desc><style>
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#6b7080;--rule:#c9ccd6;--card:#ffffff;--accent:#bf4520}
