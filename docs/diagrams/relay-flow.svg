<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="ti de"><title id="ti">Relay flow</title><desc id="de">Relay messages go through a guard to the chat route, which streams model output and tool calls back to client tools gated by permission.</desc><style>
