<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="ti de"><title id="ti">Requestr data model</title><desc id="de">Twelve IndexedDB object stores with their index references, and the localStorage key groups used for UI and Relay preferences.</desc><style>
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#6b7080;--rule:#c9ccd6;--card:#ffffff;--accent:#bf4520}
